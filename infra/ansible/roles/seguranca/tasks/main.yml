---
- name: Instalar fail2ban e ufw
  ansible.builtin.apt:
    name:
      - fail2ban
      - ufw
    state: present

- name: Regras de firewall
  ansible.builtin.command:
    cmd: "ufw allow {{ item }}"
  loop:
    - "22/tcp"
    - "80/tcp"
    - "443/tcp"
    - "{{ sip_porta }}/udp"
    - "{{ sip_porta }}/tcp"
    - "{{ sip_tls_porta }}/tcp"
    - "{{ ast_rtp_inicio }}:{{ ast_rtp_fim }}/udp"
    # Fax T.38 (UDPTL): sem esta faixa a operadora negocia o T.38 e o fax
    # não passa.
    - "{{ udptl_inicio | default(4000) }}:{{ udptl_fim | default(4999) }}/udp"
  when: instalar_firewall
  register: ufw_regras
  changed_when: "'Rule added' in ufw_regras.stdout"

# A faixa do Janus só abre com o Janus instalado: aberta sem ele, eram
# duzentas portas UDP expostas sem ninguém escutando.
- name: Regras de firewall do Janus
  ansible.builtin.command:
    cmd: "ufw allow {{ janus_rtp_inicio }}:{{ janus_rtp_fim }}/udp"
  when: instalar_firewall and (instalar_janus | default(false) | bool)
  register: ufw_janus
  changed_when: "'Rule added' in ufw_janus.stdout"

# A regra antiga (20000:20200, aberta mesmo sem Janus e encostada na faixa
# de RTP do Asterisk) sai das centrais que já a tinham.
- name: Fechar a faixa antiga do Janus
  ansible.builtin.command:
    cmd: "ufw delete allow 20000:20200/udp"
  when: instalar_firewall
  register: ufw_janus_velho
  changed_when: "'Rule deleted' in ufw_janus_velho.stdout"
  failed_when: false

# As portas do TURN moram aqui, e não no papel do coturn, porque quem
# instala o ufw é este papel — e ele roda por último. Abrir a porta lá
# atrás tentava usar um comando que ainda não existia.
- name: Regras de firewall do TURN
  ansible.builtin.command:
    cmd: "ufw allow {{ item }}"
  loop:
    - "{{ turn_porta }}/udp"
    - "{{ turn_porta }}/tcp"
    - "{{ turn_porta_tls }}/tcp"
    - "{{ turn_rtp_inicio }}:{{ turn_rtp_fim }}/udp"
  when: instalar_firewall and (instalar_turn | default(true))
  register: ufw_turn
  changed_when: "'Rule added' in ufw_turn.stdout"

- name: Política padrão do firewall
  ansible.builtin.command:
    cmd: "ufw default {{ item.politica }} {{ item.direcao }}"
  loop:
    - { politica: deny,  direcao: incoming }
    - { politica: allow, direcao: outgoing }
  when: instalar_firewall
  changed_when: false

- name: Habilitar o firewall
  ansible.builtin.command: ufw --force enable
  when: instalar_firewall
  changed_when: false

# O filtro precisa existir antes do jail que o nomeia, senão o fail2ban
# recusa a configuração inteira ao reiniciar.
- name: Instalar o filtro de login do console
  ansible.builtin.template:
    src: filter-telium-console.conf.j2
    dest: /etc/fail2ban/filter.d/telium-console.conf
    mode: "0644"
  notify: reiniciar fail2ban

# O fail2ban não sobe — com todas as cadeias, não só esta — se o log de
# uma delas não existe. Numa central recém-instalada o Asterisk ainda pode
# não ter escrito nada no messages.
#
# Só cria o que falta: o dono e as permissões do que já existe ficam como
# estão (o syslog também lê esses arquivos).
- name: Garantir os logs do Asterisk que o fail2ban lê
  ansible.builtin.command:
    cmd: "install -o asterisk -g asterisk -m 0644 /dev/null /var/log/asterisk/{{ item }}"
    creates: "/var/log/asterisk/{{ item }}"
  loop:
    - messages
    - security

- name: Instalar o filtro de varredura SIP
  ansible.builtin.template:
    src: filter-telium-sip-varredura.conf.j2
    dest: /etc/fail2ban/filter.d/telium-sip-varredura.conf
    mode: "0644"
  notify: reiniciar fail2ban

- name: Configurar jail do Asterisk no fail2ban
  ansible.builtin.template:
    src: jail-telium.conf.j2
    dest: /etc/fail2ban/jail.d/telium.conf
    mode: "0644"
  notify: reiniciar fail2ban

# ------------------------------------------------------------------
# Ponte do console com o fail2ban.
#
# Bloquear tentativa errada é o certo; não ter como desfazer, não. Um
# ramal mal configurado ou um teste de softphone derruba o IP do próprio
# escritório por 24 horas, e sem esta ponte só o SSH resolvia.
# ------------------------------------------------------------------
- name: Instalar a ponte do console com o fail2ban
  ansible.builtin.template:
    src: telium-fail2ban.j2
    dest: /usr/local/sbin/telium-fail2ban
    owner: root
    group: root
    mode: "0750"

- name: Permitir que a API liste e desbane pelo fail2ban
  ansible.builtin.copy:
    dest: /etc/sudoers.d/telium-fail2ban
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      # Gerado pelo Ansible — Telium PABX. Não edite à mão.
      # O programa valida a jaula e o IP: por isso a regra aponta para
      # ele e não para o fail2ban-client, que aceita qualquer comando.
      {{ telium_user }} ALL=(root) NOPASSWD: /usr/local/sbin/telium-fail2ban

- name: Habilitar e iniciar o fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# A lista "nunca bloquear" do console. Reaplicada a cada execução: o
# arquivo que ela gera mora em jail.d, e uma reinstalação do fail2ban
# o perderia.
- name: Aplicar os endereços que nunca são bloqueados
  ansible.builtin.command: /usr/local/sbin/telium-fail2ban confiaveis
  register: f2b_confiaveis
  changed_when: false
  failed_when: false

# ------------------------------------------------------------------
# SIP, áudio e TURN só para redes conhecidas (sip_restringir_redes).
#
# Numa tabela própria do nftables, que só descarta: quem está na lista
# segue para o ufw como sempre. Por ser à parte, vale também nos
# servidores que têm um iptables antigo (rules.v4) na frente do ufw.
# Desligado, a tabela some e as portas ficam como o ufw deixa.
# ------------------------------------------------------------------
- name: Instalar o nftables (só o comando; o serviço dele fica parado)
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Instalar o telium-firewall-sip
  ansible.builtin.template:
    src: telium-firewall-sip.j2
    dest: /usr/local/sbin/telium-firewall-sip
    owner: root
    group: root
    mode: "0750"

- name: Lista fixa das redes liberadas
  ansible.builtin.copy:
    dest: "{{ sip_lista_fixa }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Gerado pelo Ansible — Telium PABX. Não edite à mão: mude
      # sip_redes_liberadas / sip_redes_extras e rode o playbook.
      {% for rede in (sip_redes_liberadas + (sip_redes_extras.split() if sip_redes_extras is string else sip_redes_extras | default([]))) | unique %}
      {{ rede }}
      {% endfor %}
  when: sip_restringir_redes | default(false) | bool

- name: Tirar a lista fixa (recurso desligado)
  ansible.builtin.file:
    path: "{{ sip_lista_fixa }}"
    state: absent
  when: not (sip_restringir_redes | default(false) | bool)

# A cada 5 minutos: tronco novo e "Nunca bloquear" entram sem ninguém
# rodar nada. O "Nunca bloquear" também reaplica na hora, pelo console.
- name: Serviço e timer do telium-firewall-sip
  ansible.builtin.copy:
    dest: "/etc/systemd/system/telium-firewall-sip.{{ item.tipo }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.conteudo }}"
  loop:
    - tipo: service
      conteudo: |
        # Gerado pelo Ansible — Telium PABX.
        [Unit]
        Description=Telium PABX: SIP, áudio e TURN só para redes conhecidas
        After=network-online.target mariadb.service asterisk.service ufw.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/telium-firewall-sip aplicar
    - tipo: timer
      conteudo: |
        # Gerado pelo Ansible — Telium PABX.
        [Unit]
        Description=Telium PABX: reaplicar as redes liberadas do SIP

        [Timer]
        OnBootSec=30s
        OnUnitActiveSec=5min

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "telium-firewall-sip.{{ item.tipo }}"
  register: firewall_sip_units

- name: Ligar ou desligar o timer do telium-firewall-sip
  ansible.builtin.systemd:
    name: telium-firewall-sip.timer
    state: "{{ 'started' if sip_restringir_redes | default(false) | bool else 'stopped' }}"
    enabled: "{{ sip_restringir_redes | default(false) | bool }}"
    daemon_reload: "{{ firewall_sip_units is changed }}"

# Sem conseguir (banco fora do ar, rede recusada pelo nftables), a tabela
# fica como estava e o timer tenta de novo: avisa, sem parar a atualização.
- name: Aplicar as redes liberadas do SIP
  ansible.builtin.command: /usr/local/sbin/telium-firewall-sip aplicar
  register: firewall_sip
  changed_when: false
  failed_when: false

- name: Estado do SIP por rede
  ansible.builtin.debug:
    msg: >-
      SIP só para redes conhecidas: {{ firewall_sip.stdout | default('') | trim }}
      {{ ('— ATENÇÃO, não aplicou agora (o timer tenta de novo em 5 minutos): ' ~ (firewall_sip.stderr | default('') | trim))
         if firewall_sip.rc | default(0) != 0 else '' }}
