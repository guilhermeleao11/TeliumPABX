---
- name: Instalar fail2ban e ufw
  ansible.builtin.apt:
    name:
      - fail2ban
      - ufw
    state: present

- name: Regras de firewall
  ansible.builtin.command:
    cmd: "ufw allow {{ item }}"
  loop:
    - "22/tcp"
    - "80/tcp"
    - "443/tcp"
    - "{{ sip_porta }}/udp"
    - "{{ sip_porta }}/tcp"
    - "{{ sip_tls_porta }}/tcp"
    - "{{ ast_rtp_inicio }}:{{ ast_rtp_fim }}/udp"
    - "{{ janus_rtp_inicio }}:{{ janus_rtp_fim }}/udp"
  when: instalar_firewall
  register: ufw_regras
  changed_when: "'Rule added' in ufw_regras.stdout"

# As portas do TURN moram aqui, e não no papel do coturn, porque quem
# instala o ufw é este papel — e ele roda por último. Abrir a porta lá
# atrás tentava usar um comando que ainda não existia.
- name: Regras de firewall do TURN
  ansible.builtin.command:
    cmd: "ufw allow {{ item }}"
  loop:
    - "{{ turn_porta }}/udp"
    - "{{ turn_porta }}/tcp"
    - "{{ turn_porta_tls }}/tcp"
    - "{{ turn_rtp_inicio }}:{{ turn_rtp_fim }}/udp"
  when: instalar_firewall and (instalar_turn | default(true))
  register: ufw_turn
  changed_when: "'Rule added' in ufw_turn.stdout"

- name: Política padrão do firewall
  ansible.builtin.command:
    cmd: "ufw default {{ item.politica }} {{ item.direcao }}"
  loop:
    - { politica: deny,  direcao: incoming }
    - { politica: allow, direcao: outgoing }
  when: instalar_firewall
  changed_when: false

- name: Habilitar o firewall
  ansible.builtin.command: ufw --force enable
  when: instalar_firewall
  changed_when: false

# O filtro precisa existir antes do jail que o nomeia, senão o fail2ban
# recusa a configuração inteira ao reiniciar.
- name: Instalar o filtro de login do console
  ansible.builtin.template:
    src: filter-telium-console.conf.j2
    dest: /etc/fail2ban/filter.d/telium-console.conf
    mode: "0644"
  notify: reiniciar fail2ban

- name: Configurar jail do Asterisk no fail2ban
  ansible.builtin.template:
    src: jail-telium.conf.j2
    dest: /etc/fail2ban/jail.d/telium.conf
    mode: "0644"
  notify: reiniciar fail2ban

# ------------------------------------------------------------------
# Ponte do console com o fail2ban.
#
# Bloquear tentativa errada é o certo; não ter como desfazer, não. Um
# ramal mal configurado ou um teste de softphone derruba o IP do próprio
# escritório por 24 horas, e sem esta ponte só o SSH resolvia.
# ------------------------------------------------------------------
- name: Instalar a ponte do console com o fail2ban
  ansible.builtin.template:
    src: telium-fail2ban.j2
    dest: /usr/local/sbin/telium-fail2ban
    owner: root
    group: root
    mode: "0750"

- name: Permitir que a API liste e desbane pelo fail2ban
  ansible.builtin.copy:
    dest: /etc/sudoers.d/telium-fail2ban
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      # Gerado pelo Ansible — Telium PABX. Não edite à mão.
      # O programa valida a jaula e o IP: por isso a regra aponta para
      # ele e não para o fail2ban-client, que aceita qualquer comando.
      {{ telium_user }} ALL=(root) NOPASSWD: /usr/local/sbin/telium-fail2ban

- name: Habilitar e iniciar o fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
