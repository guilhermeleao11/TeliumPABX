---
- name: Publicar o front-end
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../{{ item }}"
    dest: "{{ telium_web }}/"
    owner: "{{ telium_user }}"
    group: "{{ telium_group }}"
    mode: preserve
  loop:
    - index.html
    - app.html
    - assets

# Os scripts de banco vão para a VM junto com o código: é o que deixa
# "php bin/telium migrar" funcionar num servidor que só tem o deploy.
- name: Publicar os scripts de banco
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../sql/"
    dest: "{{ telium_base }}/sql/"
    owner: "{{ telium_user }}"
    group: "{{ telium_group }}"
    mode: "0640"

- name: Publicar o código da API
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../api/"
    dest: "{{ telium_api }}/"
    owner: "{{ telium_user }}"
    group: "{{ telium_group }}"
    mode: preserve

- name: Criar arquivo de ambiente da API
  ansible.builtin.template:
    src: env.j2
    dest: "{{ telium_api }}/.env"
    owner: "{{ telium_user }}"
    group: "{{ telium_group }}"
    mode: "0640"

- name: Instalar dependências do Composer
  ansible.builtin.command:
    cmd: composer install --no-dev --optimize-autoloader --no-interaction
    chdir: "{{ telium_api }}"
    creates: "{{ telium_api }}/vendor/autoload.php"
  become_user: "{{ telium_user }}"
  become: true
  environment:
    COMPOSER_HOME: /tmp/composer
    COMPOSER_ALLOW_SUPERUSER: "1"

- name: Criar diretórios de trabalho da API
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ telium_user }}"
    group: "{{ telium_group }}"
    mode: "0750"
  loop:
    - "{{ telium_api }}/var"
    - "{{ telium_api }}/var/cache"
    - /var/lib/php/sessions

# Fotos da agenda: ficam dentro da raiz web para o nginx servir direto,
# fora de assets/ para a publicação do front-end não passar por cima.
- name: Criar o diretório de fotos dos contatos
  ansible.builtin.file:
    path: "{{ telium_web }}/uploads/contatos"
    state: directory
    owner: "{{ telium_user }}"
    group: "{{ telium_group }}"
    mode: "0755"

# Um processo já em execução não enxerga grupos adicionados depois.
- name: Reiniciar o php-fpm para aplicar a nova participação em grupo
  ansible.builtin.service:
    name: php8.4-fpm
    state: restarted
  when: grupo_asterisk is defined and grupo_asterisk is changed

- name: Conferir se a conta da API alcança o diretório de configuração
  ansible.builtin.command: "test -w {{ asterisk_gerado_dir }}"
  become_user: "{{ telium_user }}"
  become: true
  changed_when: false
  register: acesso_conf
  failed_when: false

- name: Diagnosticar acesso negado ao diretório de configuração
  ansible.builtin.shell: |
    echo "usuário da API: {{ telium_user }} — grupos: $(id -nG {{ telium_user }})"
    echo "pai:     $(ls -ld {{ asterisk_conf_dir }})"
    echo "destino: $(ls -ld {{ asterisk_gerado_dir }} 2>&1)"
  args:
    executable: /bin/bash
  register: acesso_diag
  changed_when: false
  when: acesso_conf.rc != 0

- name: Acesso ao diretório de configuração
  ansible.builtin.debug:
    var: acesso_diag.stdout_lines
  when: acesso_conf.rc != 0

- name: Gerar os arquivos .conf do Asterisk a partir do banco
  ansible.builtin.command:
    cmd: php bin/telium gerar-config
    chdir: "{{ telium_api }}"
  become_user: "{{ telium_user }}"
  become: true
  register: gerar_config
  changed_when: "'gerado' in gerar_config.stdout"

- name: Saída do gerador de configuração
  ansible.builtin.debug:
    var: gerar_config.stdout_lines

- name: Aplicar a configuração no Asterisk
  ansible.builtin.command:
    cmd: php bin/telium aplicar-config
    chdir: "{{ telium_api }}"
  become_user: "{{ telium_user }}"
  become: true
  register: aplicar_config
  changed_when: true
  failed_when: false

- name: Saída do aplicador de configuração
  ansible.builtin.debug:
    var: aplicar_config.stdout_lines

# ------------------------------------------------------------------
# Tarifação.
#
# O custo de cada chamada é calculado FORA da ligação: fazer isso no
# dialplan seria consultar o banco no meio do atendimento, e um banco
# lento viraria atraso para quem está no telefone. De hora em hora, o
# que ainda não tem custo ganha um.
#
# Chamada já tarifada não é recalculada: o preço fica congelado no que
# valia quando ela aconteceu, que é como uma fatura precisa se comportar.
# ------------------------------------------------------------------
- name: Instalar a unidade de tarifação
  ansible.builtin.copy:
    dest: "/etc/systemd/system/telium-tarifar.{{ item.tipo }}"
    mode: "0644"
    content: "{{ item.conteudo }}"
  loop:
    - tipo: service
      conteudo: |
        # Gerado pelo Ansible — Telium PABX. Não edite à mão.
        [Unit]
        Description=Telium PABX — calcula o custo das chamadas
        After=mariadb.service

        [Service]
        Type=oneshot
        User={{ telium_user }}
        WorkingDirectory={{ telium_api }}
        ExecStart=/usr/bin/php {{ telium_api }}/bin/telium tarifar
    - tipo: timer
      conteudo: |
        # Gerado pelo Ansible — Telium PABX. Não edite à mão.
        [Unit]
        Description=Tarifa as chamadas novas de hora em hora

        [Timer]
        OnCalendar=hourly
        AccuracySec=5m
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "telium-tarifar.{{ item.tipo }}"
  notify: recarregar systemd da api

- name: Aplicar a unidade de tarifação
  ansible.builtin.meta: flush_handlers

- name: Habilitar o temporizador de tarifação
  ansible.builtin.systemd_service:
    name: telium-tarifar.timer
    state: started
    enabled: true
    daemon_reload: true

# Depois de tudo publicado, a bateria confere o que já foi corrigido uma
# vez: a injeção pelo cadastro, o TOTP, as permissões, a integridade do
# banco e se alguma rota da API ficou sem exigir sessão. Falha aqui
# interrompe o playbook — é exatamente o que se quer saber antes de
# entregar a central.
- name: Rodar a bateria de testes
  ansible.builtin.command:
    cmd: php bin/telium testar
    chdir: "{{ telium_api }}"
  become_user: "{{ telium_user }}"
  become: true
  register: testes
  changed_when: false

- name: Resultado da bateria de testes
  ansible.builtin.debug:
    var: testes.stdout_lines
