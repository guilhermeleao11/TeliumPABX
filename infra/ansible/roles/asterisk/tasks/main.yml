---
- name: Instalar dependências de compilação do Asterisk
  ansible.builtin.apt:
    name:
      - build-essential
      - autoconf
      - automake
      - libtool
      - pkg-config
      - libedit-dev
      - libjansson-dev
      - libsqlite3-dev
      - uuid-dev
      - libxml2-dev
      - libssl-dev
      - libncurses-dev
      - libcurl4-openssl-dev
      - libsrtp2-dev
      - libopus-dev
      - libogg-dev
      - libvorbis-dev
      - libspeex-dev
      - libspeexdsp-dev
      - unixodbc-dev
      - subversion
      - wget
      - bzip2
      - xmlstarlet
    state: present

- name: Criar grupo asterisk
  ansible.builtin.group:
    name: asterisk
    system: true

- name: Criar usuário asterisk
  ansible.builtin.user:
    name: asterisk
    group: asterisk
    groups: audio,dialout
    append: true
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/asterisk
    create_home: false

- name: Verificar se o Asterisk {{ asterisk_versao }} já está instalado
  ansible.builtin.command: asterisk -V
  register: ast_instalado
  changed_when: false
  failed_when: false

- name: Definir se precisa compilar
  ansible.builtin.set_fact:
    ast_precisa_compilar: >-
      {{ compilar_asterisk and (asterisk_versao not in (ast_instalado.stdout | default(''))) }}

- name: Informar decisão de compilação
  ansible.builtin.debug:
    msg: >-
      {{ 'Vai compilar o Asterisk ' ~ asterisk_versao ~ ' (leva de 5 a 15 minutos)'
         if ast_precisa_compilar
         else 'Asterisk já instalado: ' ~ (ast_instalado.stdout | default('n/d')) }}

# ------------------------------------------------------------------
# Compilação
# ------------------------------------------------------------------
- name: Baixar o fonte do Asterisk
  ansible.builtin.get_url:
    url: "https://downloads.asterisk.org/pub/telephony/asterisk/asterisk-{{ asterisk_versao }}.tar.gz"
    dest: "{{ src_dir }}/asterisk-{{ asterisk_versao }}.tar.gz"
    mode: "0644"
  when: ast_precisa_compilar

- name: Baixar o checksum oficial
  ansible.builtin.get_url:
    url: "{{ asterisk_sha_url }}"
    dest: "{{ src_dir }}/asterisk-{{ asterisk_versao }}.tar.gz.sha256"
    mode: "0644"
  when: ast_precisa_compilar
  failed_when: false

- name: Conferir integridade do pacote
  ansible.builtin.shell:
    cmd: sha256sum -c "asterisk-{{ asterisk_versao }}.tar.gz.sha256"
    chdir: "{{ src_dir }}"
  when: ast_precisa_compilar
  changed_when: false
  failed_when: false
  register: ast_sha

- name: Resultado da verificação de integridade
  ansible.builtin.debug:
    msg: "{{ ast_sha.stdout | default('checksum não publicado — seguindo mesmo assim') }}"
  when: ast_precisa_compilar

- name: Extrair o fonte
  ansible.builtin.unarchive:
    src: "{{ src_dir }}/asterisk-{{ asterisk_versao }}.tar.gz"
    dest: "{{ src_dir }}"
    remote_src: true
    creates: "{{ src_dir }}/asterisk-{{ asterisk_versao }}/configure"
  when: ast_precisa_compilar

# As dependências essenciais já foram instaladas acima. Este script cobre
# os extras e às vezes tropeça em nomes de pacote que mudaram na distro,
# então tratamos como melhor esforço.
- name: Instalar pré-requisitos declarados pelo próprio Asterisk
  ansible.builtin.shell:
    cmd: ./contrib/scripts/install_prereq install
    chdir: "{{ src_dir }}/asterisk-{{ asterisk_versao }}"
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: ast_precisa_compilar
  changed_when: true
  failed_when: false
  register: prereq

- name: Aviso se algum pré-requisito extra falhou
  ansible.builtin.debug:
    msg: >-
      install_prereq terminou com rc={{ prereq.rc }}. As dependências
      essenciais já foram instaladas pelo playbook; seguindo com a compilação.
  when: ast_precisa_compilar and prereq.rc | default(0) != 0

- name: Configurar a compilação
  ansible.builtin.command:
    cmd: >-
      ./configure
      --with-pjproject-bundled
      --with-jansson-bundled
      --with-libedit
      --libdir=/usr/lib/{{ ansible_facts.architecture }}-linux-gnu
    chdir: "{{ src_dir }}/asterisk-{{ asterisk_versao }}"
    creates: "{{ src_dir }}/asterisk-{{ asterisk_versao }}/makeopts"
  when: ast_precisa_compilar

- name: Gerar menuselect.makeopts
  ansible.builtin.command:
    cmd: make menuselect.makeopts
    chdir: "{{ src_dir }}/asterisk-{{ asterisk_versao }}"
    creates: "{{ src_dir }}/asterisk-{{ asterisk_versao }}/menuselect.makeopts"
  when: ast_precisa_compilar

- name: Selecionar módulos obrigatórios
  ansible.builtin.command:
    cmd: >-
      menuselect/menuselect
      --enable chan_pjsip --enable res_pjsip --enable res_pjsip_transport_websocket
      --enable res_srtp --enable res_http_websocket
      --enable res_odbc --enable res_config_odbc --enable func_odbc
      --enable cdr_adaptive_odbc --enable cel_odbc
      --enable app_queue --enable app_voicemail --enable app_confbridge
      --enable app_directory --enable app_mixmonitor --enable app_stack
      --enable format_wav --enable format_pcm --enable format_gsm
      --enable res_ari --enable res_ari_channels --enable res_ari_events
      --enable res_agi --enable res_musiconhold
      --disable BUILD_NATIVE
      menuselect.makeopts
    chdir: "{{ src_dir }}/asterisk-{{ asterisk_versao }}"
  when: ast_precisa_compilar
  changed_when: true

- name: Selecionar módulos e sons opcionais (falha aqui não interrompe)
  ansible.builtin.command:
    cmd: "menuselect/menuselect --enable {{ item }} menuselect.makeopts"
    chdir: "{{ src_dir }}/asterisk-{{ asterisk_versao }}"
  loop:
    - codec_opus
    - CORE-SOUNDS-EN-GSM
    - MOH-OPSOUND-WAV
    - EXTRA-SOUNDS-EN-GSM
  when: ast_precisa_compilar
  failed_when: false
  changed_when: false

# O projeto Asterisk não publica áudios em português — os idiomas
# oficiais são en, en_AU, en_GB, en_NZ, es, fr, it, ja, ru e sv. A tarefa
# que ficava aqui pedia CORE-SOUNDS-PT_BR-GSM ao menuselect, opção que
# não existe, e com failed_when: false nunca reclamou: a central era
# entregue falando inglês e ninguém via.
#
# Um pacote próprio entra por sons_dir. A bateria de testes confere, no
# fim do provisionamento, se os áudios existem no idioma configurado.
- name: Instalar o pacote de áudios do idioma configurado
  when: sons_dir | default('') != ''
  block:
    - name: Conferir se o diretório de áudios existe na estação
      ansible.builtin.stat:
        path: "{{ sons_dir }}"
      delegate_to: localhost
      become: false
      register: sons_origem

    - name: Avisar quando o diretório de áudios não existe
      ansible.builtin.fail:
        msg: >-
          sons_dir aponta para {{ sons_dir }}, que não existe na máquina de onde
          o playbook roda. Deixe a variável vazia ou corrija o caminho.
      when: not sons_origem.stat.exists

    - name: Publicar os áudios em sounds/{{ pabx_idioma }}
      ansible.builtin.copy:
        src: "{{ sons_dir }}/"
        dest: "/var/lib/asterisk/sounds/{{ pabx_idioma }}/"
        owner: asterisk
        group: asterisk
        mode: "0644"
      notify: recarregar asterisk

- name: Compilar (pode levar vários minutos)
  ansible.builtin.command:
    cmd: "make -j{{ ansible_facts.processor_vcpus | default(2) }}"
    chdir: "{{ src_dir }}/asterisk-{{ asterisk_versao }}"
  when: ast_precisa_compilar
  changed_when: true

- name: Instalar binários
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ src_dir }}/asterisk-{{ asterisk_versao }}"
  when: ast_precisa_compilar
  changed_when: true

- name: Instalar rotação de logs
  ansible.builtin.command:
    cmd: make install-logrotate
    chdir: "{{ src_dir }}/asterisk-{{ asterisk_versao }}"
  when: ast_precisa_compilar
  changed_when: true
  failed_when: false

# ------------------------------------------------------------------
# Diretórios, configuração e serviço
# ------------------------------------------------------------------
- name: Criar diretórios do Asterisk com dono correto
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: asterisk
    group: asterisk
    mode: "0750"
  loop:
    - /etc/asterisk
    - /var/lib/asterisk
    - /var/log/asterisk
    - /var/spool/asterisk
    - /var/run/asterisk
    - /var/spool/asterisk/monitor
    # O "make install" cria estes como root, e o Asterisk roda como
    # asterisk: sem o dono certo, VoiceMail, Dictate e ReceiveFAX falham
    # com "Permission denied" no meio da chamada. O correio de voz é o
    # pior: quem ligou é desligado em vez de deixar recado, e a única
    # pista é um WARNING no log.
    - /var/spool/asterisk/voicemail
    - /var/spool/asterisk/dictate
    - /var/spool/asterisk/fax
    - /var/spool/asterisk/tmp
    # Sem o diretório, a classe [default] de música em espera some sem
    # avisar e as filas tocam silêncio.
    - /var/lib/asterisk/moh

# ------------------------------------------------------------------
# Música em espera.
#
# O MOH-OPSOUND-WAV é pedido ao menuselect com "falha aqui não
# interrompe" — e por isso ele pode simplesmente não entrar: sem saída
# para a internet na hora de compilar, ou num alvo que o menuselect não
# reconheça, o make termina bem e /var/lib/asterisk/moh fica vazio.
# A classe [default] continua existindo, apontando para um diretório sem
# nada, e quem espera na fila ouve SILÊNCIO. Não há erro em lugar nenhum
# — é o mesmo modo de falhar dos áudios do idioma.
#
# Então se confere e, faltando, baixa o pacote direto do projeto.
# ------------------------------------------------------------------
- name: Conferir se a música em espera veio na compilação
  ansible.builtin.find:
    paths: /var/lib/asterisk/moh
    patterns: "*.wav,*.gsm,*.ulaw,*.alaw,*.sln,*.g722"
  register: moh_encontrada

- name: Baixar e instalar a música em espera padrão do Asterisk
  when: moh_encontrada.matched | int == 0
  block:
    - name: Baixar o pacote de música em espera
      ansible.builtin.get_url:
        url: "https://downloads.asterisk.org/pub/telephony/sounds/asterisk-moh-opsound-wav-current.tar.gz"
        dest: "{{ src_dir }}/moh-opsound-wav.tar.gz"
        mode: "0644"
        timeout: 60
      register: moh_baixada
      retries: 2
      delay: 5
      until: moh_baixada is succeeded

    - name: Descompactar a música em espera
      ansible.builtin.unarchive:
        src: "{{ src_dir }}/moh-opsound-wav.tar.gz"
        dest: /var/lib/asterisk/moh
        remote_src: true
        owner: asterisk
        group: asterisk
      notify: recarregar asterisk

  rescue:
    # Sem internet na hora de instalar, a entrega não pode parar por
    # causa de música — mas também não pode seguir em silêncio.
    - name: Avisar que a música em espera não pôde ser instalada
      ansible.builtin.debug:
        msg: >-
          Não foi possível baixar a música em espera padrão. As filas vão tocar
          silêncio até alguém enviar um áudio da categoria "espera" pelo console,
          em Aplicações > Anúncios. A bateria de testes reprova esta instalação.

- name: Ajustar o dono da música em espera
  ansible.builtin.file:
    path: /var/lib/asterisk/moh
    state: directory
    owner: asterisk
    group: asterisk
    recurse: true

# /etc/asterisk é 0750 asterisk:asterisk. Sem estar no grupo, a conta da
# API nem atravessa o diretório pai — e um is_dir() falha como se o
# destino não existisse.
- name: Dar ao usuário da API acesso ao grupo asterisk
  ansible.builtin.user:
    name: "{{ telium_user }}"
    groups: asterisk
    append: true
  register: grupo_asterisk

- name: Criar diretório dos .conf gerados pela API
  ansible.builtin.file:
    path: "{{ asterisk_gerado_dir }}"
    state: directory
    owner: "{{ telium_user }}"
    group: asterisk
    mode: "02775"        # setgid: arquivos novos nascem no grupo asterisk

# O transporte TLS do pjsip.conf aponta para cá, então o par precisa
# existir antes de o Asterisk ler a configuração. Começa com o de fábrica;
# o console troca depois, pelo módulo de certificados.
- name: Criar o diretório de chaves do Asterisk
  ansible.builtin.file:
    path: "{{ cert_asterisk_dir }}"
    state: directory
    owner: root
    group: asterisk
    mode: "0750"

- name: Instalar o par de fábrica para o SIP TLS
  ansible.builtin.copy:
    src: "{{ item.origem }}"
    dest: "{{ item.destino }}"
    remote_src: true
    force: false
    owner: root
    group: asterisk
    mode: "{{ item.modo }}"
  loop:
    - { origem: "{{ tls_fabrica_cert }}", destino: "{{ cert_asterisk_dir }}/asterisk.crt", modo: "0644" }
    - { origem: "{{ tls_fabrica_key }}",  destino: "{{ cert_asterisk_dir }}/asterisk.key", modo: "0640" }
  loop_control:
    label: "{{ item.destino }}"

# Estes dois o Asterisk só lê ao subir: o [options] do asterisk.conf e a
# lista de módulos do modules.conf. Um "core reload" aceita o arquivo
# novo sem aplicar nada — por isso eles vão à parte, avisando o handler
# que reinicia quando a central estiver sem chamada.
- name: Publicar o que só vale com o Asterisk subindo de novo
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/asterisk/{{ item }}"
    owner: asterisk
    group: asterisk
    mode: "0640"
  loop:
    - asterisk.conf
    - modules.conf
  register: base_precisa_reiniciar
  notify: reiniciar asterisk quando der

# Os arquivos incluídos vêm ANTES dos que os incluem, e a ordem é o que
# separa uma central funcionando de uma central muda.
#
# O extensions.conf tem #include para cada arquivo que a API gera. Se um
# deles não existir quando o Asterisk ler a configuração, o pbx_config
# RECUSA carregar inteiro: o dialplan some, e a central para de rotear
# qualquer chamada. O sintoma na tela é enganoso — o comando
# "dialplan reload" passa a não existir, porque quem o registra é o
# módulo que não subiu.
#
# Publicando os marcadores primeiro, o #include sempre encontra alguma
# coisa, mesmo que seja um arquivo com uma linha de comentário.

# Os transportes saíram do pjsip.conf estático e viraram arquivo
# gerado, porque mudar o IP público passou a ser tarefa do console. O
# ponto de partida tem de existir antes do pjsip.conf que o inclui: sem
# nenhum transporte o Asterisk sobe e não atende ninguém, nem SIP nem
# WebRTC, e o motivo fica escondido numa linha de #include.
- name: Criar ponto de partida dos transportes (a API sobrescreve)
  ansible.builtin.template:
    src: pjsip.transports.conf.j2
    dest: "{{ asterisk_gerado_dir }}/pjsip.transports.conf"
    owner: "{{ telium_user }}"
    group: asterisk
    mode: "0640"
    force: false          # nunca sobrescreve o que a API já gerou
  notify: recarregar asterisk

- name: Criar placeholders dos arquivos gerados (a API sobrescreve)
  ansible.builtin.copy:
    dest: "{{ asterisk_gerado_dir }}/{{ item.arquivo }}"
    content: "{{ item.conteudo }}\n"
    owner: "{{ telium_user }}"
    group: asterisk
    mode: "0640"
    force: false          # nunca sobrescreve o que a API já gerou
  loop:
    - { arquivo: "pjsip.endpoints.conf", conteudo: "; gerado pela API — não edite à mão" }
    - { arquivo: "pjsip.trunks.conf",    conteudo: "; gerado pela API — não edite à mão" }
    - { arquivo: "rtp.ice.conf",         conteudo: "; gerado pela API — não edite à mão" }
    - { arquivo: "extensions.recursos.conf",   conteudo: "[telium-recursos]\n; gerado pela API" }
    - { arquivo: "extensions.listanegra.conf", conteudo: "[telium-listanegra]\n; gerado pela API" }
    - { arquivo: "extensions.allowlist.conf",  conteudo: "[telium-allowlist]\n; gerado pela API" }
    - { arquivo: "extensions.ramais.conf",  conteudo: "[telium-ramais]\n; gerado pela API" }
    - { arquivo: "extensions.saida.conf",   conteudo: "[telium-saida]\n; gerado pela API" }
    - { arquivo: "extensions.entrada.conf", conteudo: "[telium-entrada]\n; gerado pela API" }
    - { arquivo: "extensions.ura.conf",     conteudo: "[telium-ura]\n; gerado pela API" }
    - { arquivo: "extensions.filas.conf",   conteudo: "[telium-filas]\n; gerado pela API" }
    - { arquivo: "extensions.grupos.conf",  conteudo: "[telium-grupos]\n; gerado pela API" }
    - { arquivo: "extensions.pesquisa.conf",     conteudo: "[telium-pesquisa]\n; gerado pela API" }
    - { arquivo: "extensions.confirmacao.conf",  conteudo: "; gerado pela API" }
    - { arquivo: "extensions.conferencias.conf", conteudo: "[telium-conferencias]\n; gerado pela API" }
    - { arquivo: "extensions.anuncios.conf",     conteudo: "[telium-anuncios]\n; gerado pela API" }
    - { arquivo: "extensions.condicoes.conf",    conteudo: "[telium-condicoes]\n; gerado pela API" }
    - { arquivo: "extensions.estacionamento.conf", conteudo: "; gerado pela API" }
    - { arquivo: "extensions.paging.conf",  conteudo: "[telium-paging]\n; gerado pela API" }
    - { arquivo: "extensions.disa.conf",    conteudo: "[telium-disa]\n; gerado pela API" }
    - { arquivo: "musicaespera.conf",       conteudo: "; gerado pela API" }
    - { arquivo: "queues.conf",             conteudo: "; gerado pela API" }
    - { arquivo: "voicemail.conf",          conteudo: "[telium]\n; gerado pela API" }
    - { arquivo: "voicemail.geral.conf",    conteudo: "; gerado pela API" }
    - { arquivo: "confbridge.conf",         conteudo: "; gerado pela API" }
    - { arquivo: "res_parking.conf",        conteudo: "; gerado pela API" }
    - { arquivo: "pjsip.acl.conf",          conteudo: "; gerado pela API" }
  loop_control:
    label: "{{ item.arquivo }}"

- name: Criar arquivos de personalização (nunca tocados pelo gerador)
  ansible.builtin.copy:
    dest: "{{ asterisk_gerado_dir }}/{{ item }}"
    content: "; Personalizações manuais — o gerador da API nunca sobrescreve este arquivo.\n"
    owner: "{{ telium_user }}"
    group: asterisk
    mode: "0660"
    force: false
  loop:
    - pjsip_custom.conf
    - extensions_custom.conf
    - queues_custom.conf
    - confbridge_custom.conf

- name: Publicar configuração base do Asterisk
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/asterisk/{{ item }}"
    owner: asterisk
    group: asterisk
    mode: "0640"
  loop:
    - logger.conf
    - rtp.conf
    - http.conf
    - ari.conf
    - res_odbc.conf
    - func_odbc.conf
    - cdr.conf
    - cdr_adaptive_odbc.conf
    - cel.conf
    - cel_odbc.conf
    - pjsip.conf
    - extensions.conf
    - queues.conf
    - confbridge.conf
    - res_parking.conf
    - indications.conf
    - udptl.conf
    - pjproject.conf
    - resolver_unbound.conf
    - queuerules.conf
    - res_fax.conf
    - voicemail.conf
    - musiconhold.conf
    - features.conf
    # Os de baixo não mudam nada no funcionamento: existem porque o
    # módulo que os lê registra erro a cada reload quando faltam, e o
    # console precisa mostrar só problema de verdade.
    - acl.conf
    - ccss.conf
    - codecs.conf
    - amd.conf
    - websocket_client.conf
    - pjsip_notify.conf
  notify: recarregar asterisk

# O código *68 grava a hora; sem alguém para ler e ligar de volta, ele
# não seria um despertador de verdade.
- name: Instalar o disparador do despertador
  ansible.builtin.template:
    src: telium-despertador.j2
    dest: /usr/local/sbin/telium-despertador
    owner: root
    group: root
    mode: "0750"

- name: Instalar a unidade do despertador
  ansible.builtin.copy:
    dest: "/etc/systemd/system/telium-despertador.{{ item.tipo }}"
    mode: "0644"
    content: "{{ item.conteudo }}"
  loop:
    - tipo: service
      conteudo: |
        # Gerado pelo Ansible — Telium PABX. Não edite à mão.
        [Unit]
        Description=Telium PABX — despertador
        After=asterisk.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/telium-despertador
    - tipo: timer
      conteudo: |
        # Gerado pelo Ansible — Telium PABX. Não edite à mão.
        [Unit]
        Description=Verifica despertadores a cada minuto

        [Timer]
        OnCalendar=*:0/1
        AccuracySec=10s

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "telium-despertador.{{ item.tipo }}"
  notify: recarregar systemd do despertador

- name: Aplicar a unidade do despertador
  ansible.builtin.meta: flush_handlers

- name: Habilitar o temporizador do despertador
  ansible.builtin.systemd_service:
    name: telium-despertador.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Publicar manager.conf
  ansible.builtin.template:
    src: manager.conf.j2
    dest: /etc/asterisk/manager.conf
    owner: asterisk
    group: asterisk
    mode: "0640"
  notify:
    - recarregar asterisk
    - recarregar manager

# O pacote deixa arquivos que só rendem aviso: users.conf está obsoleto e
# o extensions.ael traz um dialplan de exemplo com macros que não existem.
- name: Remover arquivos de exemplo que só enchem o log
  ansible.builtin.file:
    path: "/etc/asterisk/{{ item }}"
    state: absent
  loop:
    - users.conf
    - extensions.ael
    - extensions.lua

- name: Instalar unidade systemd
  ansible.builtin.template:
    src: asterisk.service.j2
    dest: /etc/systemd/system/asterisk.service
    mode: "0644"
  notify: recarregar systemd

- name: Habilitar e iniciar o Asterisk
  ansible.builtin.systemd_service:
    name: asterisk
    state: started
    enabled: true
    daemon_reload: true

# Mesmo motivo do Janus: garantir que um reload pendente já aconteceu.
- name: Aplicar recargas pendentes antes de verificar
  ansible.builtin.meta: flush_handlers

- name: Aguardar o Asterisk responder
  ansible.builtin.command: asterisk -rx "core show version"
  register: ast_versao
  retries: 10
  delay: 3
  until: ast_versao.rc == 0
  changed_when: false

- name: Versão em execução
  ansible.builtin.debug:
    msg: "{{ ast_versao.stdout_lines[0] }}"

# ------------------------------------------------------------------
# O AMI é o caminho pelo qual a API aplica configuração e origina
# chamadas. Se a autenticação não passar, nada disso funciona — melhor
# descobrir aqui do que no /api/health.
# ------------------------------------------------------------------
# ------------------------------------------------------------------
# O AMI é o caminho pelo qual a API aplica configuração e origina
# chamadas. Se a autenticação não passar, nada disso funciona — melhor
# descobrir aqui do que no /api/health.
#
# As credenciais vão por variável de ambiente, não na linha de comando.
# Assim a senha não aparece na saída e não precisamos de no_log, que
# censuraria o resultado registrado e deixaria a tarefa sem .rc.
# ------------------------------------------------------------------
- name: Testar autenticação no AMI
  ansible.builtin.shell: |
    python3 - <<'PYAMI'
    import os, socket, sys

    porta = int(os.environ["AMI_PORTA"])

    def pacote_completo(texto):
        """Um pacote do AMI termina em linha em branco."""
        return texto.endswith("\r\n\r\n") or texto.endswith("\n\n")

    try:
        with socket.create_connection(("127.0.0.1", porta), timeout=5) as s:
            s.settimeout(5)
            s.recv(4096)                               # banner
            login = "Action: Login\r\nUsername: {}\r\nSecret: {}\r\n\r\n".format(
                os.environ["AMI_USUARIO"], os.environ["AMI_SENHA"])
            s.sendall(login.encode())

            # O Asterisk responde ao login e, se o usuario tem permissao de
            # sistema, emite FullyBooted em seguida. Ler uma vez so pode
            # devolver o evento e nao a resposta, entao lemos ate encontrar
            # a linha Response: ou esgotar o tempo.
            buffer = ""
            resposta = ""
            for _ in range(10):
                try:
                    pedaco = s.recv(4096).decode(errors="replace")
                except socket.timeout:
                    break
                if not pedaco:
                    break
                buffer += pedaco
                for bloco in buffer.split("\r\n\r\n"):
                    if "Response:" in bloco:
                        resposta = bloco
                        break
                if resposta or pacote_completo(buffer):
                    if resposta:
                        break

            s.sendall(b"Action: Logoff\r\n\r\n")
    except OSError as e:
        print("Nao foi possivel falar com o AMI em 127.0.0.1:{} - {}".format(porta, e))
        sys.exit(2)

    if not resposta:
        print("O AMI nao devolveu uma linha Response. Recebido:")
        print(buffer.strip()[:400] or "(nada)")
        sys.exit(3)

    for linha in resposta.splitlines():
        if linha.startswith(("Response:", "Message:")):
            print(linha.strip())

    sys.exit(0 if "Success" in resposta else 1)
    PYAMI
  args:
    executable: /bin/bash
  environment:
    AMI_PORTA: "{{ ami_porta }}"
    AMI_USUARIO: "{{ ami_usuario }}"
    AMI_SENHA: "{{ ami_senha }}"
  register: ami_teste
  changed_when: false
  failed_when: false

- name: Resultado do teste de AMI
  ansible.builtin.debug:
    msg: >-
      rc={{ ami_teste.rc | default('(tarefa pulada)') }}
      · {{ ami_teste.stdout_lines | default(['(sem saída)']) | join(' | ') }}
      {{ ('· stderr: ' ~ ami_teste.stderr) if ami_teste.stderr | default('') else '' }}

- name: Recarregar o manager e testar o AMI de novo
  when: ami_teste.rc | default(1) != 0
  block:
    - name: Recarregar a configuração do manager
      ansible.builtin.command: asterisk -rx "manager reload"
      changed_when: true

    - name: Aguardar o manager reler a configuração
      ansible.builtin.wait_for:
        timeout: 2

    - name: Nova tentativa de autenticação no AMI
      ansible.builtin.shell: |
        python3 - <<'PYAMI'
        import os, socket, sys

        porta = int(os.environ["AMI_PORTA"])

        def pacote_completo(texto):
            """Um pacote do AMI termina em linha em branco."""
            return texto.endswith("\r\n\r\n") or texto.endswith("\n\n")

        try:
            with socket.create_connection(("127.0.0.1", porta), timeout=5) as s:
                s.settimeout(5)
                s.recv(4096)                               # banner
                login = "Action: Login\r\nUsername: {}\r\nSecret: {}\r\n\r\n".format(
                    os.environ["AMI_USUARIO"], os.environ["AMI_SENHA"])
                s.sendall(login.encode())

                # O Asterisk responde ao login e, se o usuario tem permissao de
                # sistema, emite FullyBooted em seguida. Ler uma vez so pode
                # devolver o evento e nao a resposta, entao lemos ate encontrar
                # a linha Response: ou esgotar o tempo.
                buffer = ""
                resposta = ""
                for _ in range(10):
                    try:
                        pedaco = s.recv(4096).decode(errors="replace")
                    except socket.timeout:
                        break
                    if not pedaco:
                        break
                    buffer += pedaco
                    for bloco in buffer.split("\r\n\r\n"):
                        if "Response:" in bloco:
                            resposta = bloco
                            break
                    if resposta or pacote_completo(buffer):
                        if resposta:
                            break

                s.sendall(b"Action: Logoff\r\n\r\n")
        except OSError as e:
            print("Nao foi possivel falar com o AMI em 127.0.0.1:{} - {}".format(porta, e))
            sys.exit(2)

        if not resposta:
            print("O AMI nao devolveu uma linha Response. Recebido:")
            print(buffer.strip()[:400] or "(nada)")
            sys.exit(3)

        for linha in resposta.splitlines():
            if linha.startswith(("Response:", "Message:")):
                print(linha.strip())

        sys.exit(0 if "Success" in resposta else 1)
        PYAMI
      args:
        executable: /bin/bash
      environment:
        AMI_PORTA: "{{ ami_porta }}"
        AMI_USUARIO: "{{ ami_usuario }}"
        AMI_SENHA: "{{ ami_senha }}"
      register: ami_teste
      changed_when: false
      failed_when: false

- name: Diagnosticar falha de autenticação no AMI
  when: ami_teste.rc | default(1) != 0
  block:
    - name: Coletar estado do manager
      ansible.builtin.shell: |
        echo "### resposta do AMI"
        echo "{{ ami_teste.stdout | default('(sem saída)') }}"
        echo
        echo "### usuários do manager segundo o Asterisk"
        asterisk -rx "manager show users" 2>&1
        echo
        echo "### senha em manager.conf x senha gerada"
        disco=$(awk -F'=' '/^[[:space:]]*secret[[:space:]]*=/ {sub(/^[[:space:]]+/,"",$2); print $2; exit}' \
                /etc/asterisk/manager.conf 2>/dev/null)
        gerada=$(cat {{ credenciais_dir }}/ami_senha 2>/dev/null)
        # medindo com wc: a forma de contar caracteres do bash abre
        # comentário de Jinja e quebra o parser do Ansible
        echo "em disco: $(printf %s "$disco" | wc -c) caracteres · gerada: $(printf %s "$gerada" | wc -c) caracteres"
        if [ "$disco" = "$gerada" ]; then
          echo "iguais"
        else
          echo "DIFERENTES (esperado se você definiu vault_ami_senha)"
        fi

        echo
        echo "### detalhe do usuário do manager"
        asterisk -rx "manager show user {{ ami_usuario }}" 2>&1 | grep -viE "secret|password"
        echo
        echo "### o Asterisk está escutando na porta do AMI?"
        ss -lntp 2>/dev/null | grep ":{{ ami_porta }}" || echo "(nada escutando na {{ ami_porta }})"
      args:
        executable: /bin/bash
      register: ami_diag
      changed_when: false
      failed_when: false

    - name: Estado do manager
      ansible.builtin.debug:
        var: ami_diag.stdout_lines

    # Não interrompemos aqui: sem o resto do provisionamento o .env da API
    # fica com a senha antiga, o que agrava o próprio problema. O site.yml
    # cobra isso no final, depois de tudo instalado.
    - name: Registrar que o AMI está com problema
      ansible.builtin.set_fact:
        ami_ok: false

    - name: Aviso sobre o AMI
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════"
          - "O AMI não autenticou. O provisionamento continua para que"
          - "a API seja publicada com as credenciais corretas, mas"
          - "aplicar configuração e originar chamadas não vão funcionar"
          - "até isso ser resolvido."
          - "════════════════════════════════════════════════════════"

- name: Autenticação no AMI
  ansible.builtin.debug:
    msg: "AMI respondendo e autenticando como {{ ami_usuario }}"
  when: ami_teste.rc | default(1) == 0

# O reinício só acontece quando a central fica sem chamada nenhuma. Numa
# central movimentada isso pode demorar, e quem rodou o playbook precisa
# saber que uma parte da configuração ainda não está valendo.
- name: Avisar que falta reiniciar o Asterisk
  ansible.builtin.debug:
    msg:
      - "════════════════════════════════════════════════════════"
      - "asterisk.conf ou modules.conf mudaram. Essas duas coisas"
      - "só valem com o Asterisk subindo de novo, e o reinício foi"
      - "agendado para quando não houver chamada em curso."
      - ""
      - "Para conferir se já aconteceu:"
      - "  asterisk -rx 'core show uptime'"
      - "Para forçar agora, derrubando as chamadas em curso:"
      - "  systemctl restart asterisk"
      - "════════════════════════════════════════════════════════"
  when: base_precisa_reiniciar.changed | default(false)

# ------------------------------------------------------------------
# Rede de segurança: o dialplan está de pé?
#
# Um módulo que recusou carregar NÃO volta com "reload" — só reiniciando
# o Asterisk. E o pbx_config recusa carregar quando falta um arquivo do
# #include, o que deixa a central sem rotear chamada nenhuma.
#
# A situação se resolve sozinha aqui porque, a esta altura, todos os
# arquivos já foram publicados: os marcadores, os templates e os
# personalizados. Se o módulo ainda não subiu, é resto de uma execução
# anterior interrompida — e reiniciar é seguro, porque sem dialplan não
# existe chamada em curso para derrubar.
# ------------------------------------------------------------------
# As recargas pendentes precisam acontecer AGORA, e não no fim da
# execução: o papel da API roda a bateria de testes logo adiante, e ela
# pergunta ao Asterisk como ele está. Sem isto, os testes olhavam para
# a configuração anterior e acusavam problema já corrigido.
- name: Aplicar as recargas pendentes antes de conferir
  ansible.builtin.meta: flush_handlers

- name: Conferir se o módulo do dialplan está carregado
  ansible.builtin.command: asterisk -rx "module show like pbx_config"
  register: ast_pbx_config
  changed_when: false
  failed_when: false

- name: Reiniciar o Asterisk quando o dialplan não subiu
  ansible.builtin.service:
    name: asterisk
    state: restarted
  when: >-
    ast_pbx_config.rc == 0
    and ('Not Running' in ast_pbx_config.stdout
         or 'pbx_config.so' not in ast_pbx_config.stdout)
  register: ast_reiniciado

- name: Esperar o Asterisk voltar
  ansible.builtin.command: asterisk -rx "core show version"
  register: ast_voltou
  until: ast_voltou.rc == 0
  retries: 15
  delay: 2
  changed_when: false
  when: ast_reiniciado.changed | default(false)

- name: Conferir de novo o módulo do dialplan
  ansible.builtin.command: asterisk -rx "module show like pbx_config"
  register: ast_pbx_depois
  changed_when: false
  failed_when: false

- name: Contar os contextos carregados
  ansible.builtin.command: asterisk -rx "dialplan show"
  register: ast_dialplan
  changed_when: false
  failed_when: false

# Sem dialplan a central não atende nem disca. Parar aqui é melhor do
# que seguir publicando a API sobre uma base que não funciona.
#
# A conferência é sobre o módulo estar rodando, e não sobre a saída do
# "dialplan show" citar contextos: com o módulo fora, o comando ainda
# responde "2 contexts" — os que vêm de outros módulos — e uma
# verificação frouxa daria tudo certo com a central muda.
- name: Exigir que o dialplan esteja carregado
  ansible.builtin.assert:
    that:
      - "'pbx_config.so' in ast_pbx_depois.stdout"
      - "'Not Running' not in ast_pbx_depois.stdout"
    fail_msg: |
      O Asterisk está sem dialplan — a central não roteia nenhuma chamada.
      O módulo pbx_config recusou carregar, e reiniciar não resolveu.
      Quase sempre é um arquivo do #include faltando em extensions.conf:
        grep "does not exist" /var/log/asterisk/messages
    success_msg: "Dialplan carregado: {{ ast_dialplan.stdout_lines | last | default('') | trim }}"
