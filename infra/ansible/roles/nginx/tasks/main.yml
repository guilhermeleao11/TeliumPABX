---
- name: Instalar chave do repositório nginx.org
  ansible.builtin.get_url:
    url: https://nginx.org/keys/nginx_signing.key
    dest: /tmp/nginx_signing.key
    mode: "0644"

- name: Converter chave para keyring
  ansible.builtin.shell:
    cmd: gpg --dearmor --yes -o /etc/apt/keyrings/nginx.gpg /tmp/nginx_signing.key
    creates: /etc/apt/keyrings/nginx.gpg

- name: Configurar repositório nginx {{ nginx_canal }}
  ansible.builtin.deb822_repository:
    name: nginx
    types: [deb]
    uris: "https://nginx.org/packages/{{ nginx_canal }}/{{ ansible_facts.distribution | lower }}"
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [nginx]
    signed_by: /etc/apt/keyrings/nginx.gpg
    state: present
    enabled: true

- name: Atualizar índice do apt após adicionar o repositório
  ansible.builtin.apt:
    update_cache: true

- name: Fixar prioridade do repositório oficial nginx
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/99nginx
    mode: "0644"
    content: |
      Package: *
      Pin: origin nginx.org
      Pin-Priority: 900

- name: Instalar nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Confirmar versão do nginx
  ansible.builtin.command: nginx -v
  register: nginx_ver
  changed_when: false

- name: Versão do nginx
  ansible.builtin.debug:
    msg: "{{ nginx_ver.stderr | default(nginx_ver.stdout) }}"

- name: Remover site padrão
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent
  notify: recarregar nginx

- name: Publicar configuração principal
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
    validate: "nginx -t -c %s"
  notify: recarregar nginx

- name: Publicar vhost do PABX
  ansible.builtin.template:
    src: telium-pabx.conf.j2
    dest: /etc/nginx/conf.d/telium-pabx.conf
    mode: "0644"
  notify: recarregar nginx

- name: Permitir que o nginx leia o certificado
  ansible.builtin.user:
    name: nginx
    groups: ssl-cert
    append: true

- name: Habilitar e iniciar o nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Aplicar recargas pendentes antes de verificar
  ansible.builtin.meta: flush_handlers

- name: Testar a configuração
  ansible.builtin.command: nginx -t
  changed_when: false
