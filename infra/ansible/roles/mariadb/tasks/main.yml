---
- name: Garantir diretório de chaves do apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Baixar chave de assinatura do MariaDB
  ansible.builtin.get_url:
    url: https://mariadb.org/mariadb_release_signing_key.pgp
    dest: /tmp/mariadb_signing.key
    mode: "0644"

- name: Converter chave do MariaDB para keyring binário
  ansible.builtin.shell:
    cmd: gpg --dearmor --yes -o /etc/apt/keyrings/mariadb.gpg /tmp/mariadb_signing.key
    creates: /etc/apt/keyrings/mariadb.gpg

- name: Configurar repositório oficial MariaDB {{ mariadb_versao }}
  ansible.builtin.deb822_repository:
    name: mariadb
    types: [deb]
    uris: "https://mirror.mariadb.org/repo/{{ mariadb_versao }}/{{ ansible_facts.distribution | lower }}"
    suites: ["{{ ansible_facts.distribution_release }}"]
    components: [main]
    signed_by: /etc/apt/keyrings/mariadb.gpg
    state: present
    enabled: true

- name: Atualizar índice do apt após adicionar o repositório
  ansible.builtin.apt:
    update_cache: true

- name: Instalar MariaDB server e cliente
  ansible.builtin.apt:
    name:
      - mariadb-server
      - mariadb-client
      - mariadb-backup
    state: present

- name: Aplicar configuração do servidor
  ansible.builtin.template:
    src: 60-telium.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/60-telium.cnf
    mode: "0644"
  notify: reiniciar mariadb

- name: Garantir MariaDB habilitado e em execução
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Aplicar handlers pendentes antes de criar o schema
  ansible.builtin.meta: flush_handlers

- name: Confirmar versão instalada
  ansible.builtin.command: mariadbd --version
  register: mariadb_ver
  changed_when: false

- name: Mostrar versão do MariaDB
  ansible.builtin.debug:
    msg: "{{ mariadb_ver.stdout }}"

- name: Criar banco e usuários da aplicação
  ansible.builtin.command:
    cmd: mariadb --protocol=socket -uroot -e "{{ item }}"
  changed_when: false
  loop:
    - >-
      CREATE DATABASE IF NOT EXISTS `{{ db_nome }}`
      CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    - >-
      CREATE USER IF NOT EXISTS '{{ db_usuario }}'@'localhost'
      IDENTIFIED BY '{{ db_senha }}';
    - >-
      ALTER USER '{{ db_usuario }}'@'localhost' IDENTIFIED BY '{{ db_senha }}';
    - >-
      GRANT ALL PRIVILEGES ON `{{ db_nome }}`.* TO '{{ db_usuario }}'@'localhost';
    - >-
      CREATE USER IF NOT EXISTS '{{ db_cdr_usuario }}'@'localhost'
      IDENTIFIED BY '{{ db_cdr_senha }}';
    - >-
      ALTER USER '{{ db_cdr_usuario }}'@'localhost' IDENTIFIED BY '{{ db_cdr_senha }}';
    - >-
      GRANT SELECT, INSERT, UPDATE ON `{{ db_nome }}`.* TO '{{ db_cdr_usuario }}'@'localhost';
    - FLUSH PRIVILEGES;
  no_log: true

- name: Criar diretório temporário para os scripts de schema
  ansible.builtin.file:
    path: /tmp/telium-sql
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copiar scripts de schema
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/tmp/telium-sql/{{ item | basename }}"
    mode: "0600"
  loop: "{{ query('fileglob', playbook_dir + '/../sql/*.sql') | sort }}"

- name: Aplicar schema (DDL idempotente)
  ansible.builtin.shell:
    cmd: "mariadb --protocol=socket -uroot {{ db_nome }} < /tmp/telium-sql/{{ item | basename }}"
  loop: "{{ query('fileglob', playbook_dir + '/../sql/*.sql') | sort }}"
  changed_when: false

# ------------------------------------------------------------------
# Operações opcionais, sempre explícitas na linha de comando.
# ------------------------------------------------------------------
- name: Limpar a base operacional
  when: limpar_banco | default(false) | bool
  block:
    - name: Avisar sobre a limpeza
      ansible.builtin.debug:
        msg:
          - "LIMPANDO a base operacional: ramais, troncos, filas, URAs,"
          - "rotas, CDR, gravações e todos os usuários menos o admin."
          - "Empresa, perfis, permissões e a conta admin são preservados."

    - name: Copiar o script de limpeza
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../sql/opcional/limpar.sql"
        dest: /tmp/telium-sql/limpar.sql
        mode: "0600"

    - name: Executar a limpeza
      ansible.builtin.shell:
        cmd: "mariadb --protocol=socket -uroot {{ db_nome }} < /tmp/telium-sql/limpar.sql"
      changed_when: true

    - name: Reaplicar os dados essenciais
      ansible.builtin.shell:
        cmd: "mariadb --protocol=socket -uroot {{ db_nome }} < /tmp/telium-sql/03-seed.sql"
      changed_when: true

- name: Remover scripts temporários
  ansible.builtin.file:
    path: /tmp/telium-sql
    state: absent

# ---------- ODBC (usado pelo Asterisk para gravar CDR/CEL) ----------
- name: Instalar unixODBC e driver MariaDB
  ansible.builtin.apt:
    name:
      - unixodbc
      - unixodbc-dev
      - odbc-mariadb
    state: present

- name: Configurar driver ODBC
  ansible.builtin.template:
    src: odbcinst.ini.j2
    dest: /etc/odbcinst.ini
    mode: "0644"

- name: Configurar DSN ODBC do Telium
  ansible.builtin.template:
    src: odbc.ini.j2
    dest: /etc/odbc.ini
    mode: "0644"

# O usuário e a senha já estão no DSN (/etc/odbc.ini), então não vão na
# linha de comando — e sem no_log o resultado registrado continua legível.
- name: Testar conexão ODBC
  ansible.builtin.shell:
    cmd: echo "SELECT 1;" | isql -v telium-cdr
  register: odbc_teste
  changed_when: false
  failed_when: false

- name: Falhar se o ODBC não conectar
  ansible.builtin.assert:
    that: "'Connected!' in odbc_teste.stdout"
    fail_msg: >-
      O Asterisk grava CDR e CEL por ODBC e o DSN telium-cdr não conectou.
      Saída do isql: {{ odbc_teste.stdout | default('') }}
      {{ odbc_teste.stderr | default('') }}
    success_msg: "DSN telium-cdr conectou"


