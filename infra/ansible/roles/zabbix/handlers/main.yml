---
- name: reiniciar zabbix-agent2
  ansible.builtin.service:
    name: zabbix-agent2
    state: restarted

- name: recarregar nginx do zabbix
  ansible.builtin.service:
    name: nginx
    state: reloaded

- name: recarregar o AMI para o zabbix
  ansible.builtin.command: asterisk -rx "manager reload"
  changed_when: true
  failed_when: false
