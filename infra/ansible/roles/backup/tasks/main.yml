---
# Os backups moram em /var/Backup, o diretório que a ferramenta de backup
# da empresa já leva. A pasta-mãe é só garantida: dono e permissões dela
# ficam como estão.
- name: Garantir o diretório /var/Backup
  ansible.builtin.file:
    path: "{{ backup_dir | dirname }}"
    state: directory

# Até a 1.1.0 eles ficavam em /var/backup (minúsculo). Os arquivos que já
# estão lá vão para o lugar novo — o banco guarda só o nome, então o
# histórico do console continua apontando para eles — e a pasta antiga sai
# se ficar vazia.
- name: Mover os backups do lugar antigo
  ansible.builtin.shell:
    cmd: |
      antigo=/var/backup/pabx-telium
      [ -d "$antigo" ] && [ "$antigo" != "{{ backup_dir }}" ] || exit 0
      mkdir -p "{{ backup_dir }}"
      movidos=0
      for f in "$antigo"/telium-*.tar.gz; do
        [ -f "$f" ] || continue
        if [ ! -e "{{ backup_dir }}/$(basename "$f")" ]; then
          mv "$f" "{{ backup_dir }}/" && movidos=$((movidos+1))
        fi
      done
      rmdir "$antigo" 2>/dev/null
      rmdir /var/backup 2>/dev/null
      echo "movidos=$movidos"
  register: backup_mudanca
  changed_when: "(backup_mudanca.stdout | default('')) not in ['', 'movidos=0']"

# A API precisa atravessar o /var/Backup para chegar aos arquivos (Baixar,
# envio ao destino remoto). Se a pasta-mãe estiver fechada só para o root,
# ela ganha, por ACL, apenas o "atravessar" para o usuário da API — sem
# listar nem ler o que mais houver ali, e sem mudar dono nem modo dela.
- name: Conferir se a API alcança o /var/Backup
  ansible.builtin.command:
    cmd: runuser -u {{ telium_user }} -- test -x "{{ backup_dir | dirname }}"
  register: backup_atravessa
  changed_when: false
  failed_when: false

- name: Instalar as ferramentas de ACL
  ansible.builtin.apt:
    name: acl
    state: present
  when: backup_atravessa.rc != 0

- name: Deixar a API atravessar o /var/Backup
  ansible.builtin.command:
    cmd: setfacl -m u:{{ telium_user }}:x "{{ backup_dir | dirname }}"
  when: backup_atravessa.rc != 0

# A API lê (Baixar, envio ao destino remoto); só o root escreve, porque a
# restauração, que roda como root, confia no que estiver aqui.
- name: Criar diretório de backups
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: root
    group: "{{ telium_user }}"
    mode: "0750"

# O que é essencial da central no backup da empresa, num bloco marcado
# dentro do arquivo da ferramenta — as outras linhas ficam como estão.
#   /var/Backup/pabx-telium  o banco em dump consistente (copiar o
#                            /var/lib/mysql com o MariaDB rodando não serve)
#   /etc/telium              senhas de serviço e certificados enviados
#   /etc/asterisk            configuração, inclusive os _custom.conf
#   /etc/ssl/telium          certificado do console
#   /var/spool/asterisk      gravações, recados, caixas postais e fax
#   /var/lib/asterisk/...    áudios enviados e a base interna (siga-me…)
#   servidor.yml             os ajustes deste servidor (fora do Git)
- name: Procurar a lista do backup da empresa
  ansible.builtin.stat:
    path: "{{ backup_empresa_lista }}"
  register: backup_empresa
  when: backup_empresa_lista | default('') | length > 0

- name: Pôr o essencial da central no backup da empresa
  ansible.builtin.blockinfile:
    path: "{{ backup_empresa_lista }}"
    marker: "# {mark} Telium PABX — gerado pelo Ansible, não edite este bloco"
    create: false
    block: |
      I {{ backup_dir }}
      I {{ telium_etc }}
      I {{ asterisk_conf_dir }}
      I /etc/ssl/telium
      I /var/spool/asterisk
      I {{ audios_dir }}
      I /var/lib/asterisk/astdb.sqlite3
      I {{ playbook_dir }}/group_vars/all/servidor.yml
  when:
    - backup_empresa_lista | default('') | length > 0
    - backup_empresa.stat.exists | default(false)

- name: Instalar o executor de backup
  ansible.builtin.template:
    src: telium-backup.j2
    dest: /usr/local/sbin/telium-backup
    owner: root
    group: root
    mode: "0750"

# Regra de sudo sem curinga nenhum: a API dispara o executor, que decide
# o que fazer lendo o banco. Nenhum argumento é aceito.
- name: Permitir que a API dispare o backup
  ansible.builtin.copy:
    dest: /etc/sudoers.d/telium-backup
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      # Gerado pelo Ansible — Telium PABX. Não edite à mão.
      {{ telium_user }} ALL=(root) NOPASSWD: /usr/local/sbin/telium-backup

- name: Instalar a unidade de backup
  ansible.builtin.copy:
    dest: /etc/systemd/system/telium-backup.service
    mode: "0644"
    content: |
      # Gerado pelo Ansible — Telium PABX. Não edite à mão.
      [Unit]
      Description=Telium PABX — backup
      After=mariadb.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/telium-backup
      Nice=10
      IOSchedulingClass=idle
  notify: recarregar systemd

- name: Instalar o temporizador de backup
  ansible.builtin.copy:
    dest: /etc/systemd/system/telium-backup.timer
    mode: "0644"
    content: |
      # Gerado pelo Ansible — Telium PABX. Não edite à mão.
      [Unit]
      Description=Verifica rotinas de backup a cada minuto

      [Timer]
      OnCalendar=*:0/1
      AccuracySec=30s
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: recarregar systemd

- name: Aplicar mudanças de unidade antes de habilitar
  ansible.builtin.meta: flush_handlers

- name: Habilitar o temporizador de backup
  ansible.builtin.systemd_service:
    name: telium-backup.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Criar diretório de áudios do sistema
  ansible.builtin.file:
    path: "{{ audios_dir }}"
    state: directory
    owner: "{{ telium_user }}"
    group: asterisk
    mode: "02775"

- name: Instalar utilitários de áudio
  ansible.builtin.apt:
    name:
      - sox
      - libsox-fmt-all
    state: present
