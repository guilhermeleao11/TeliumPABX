---
# Os backups moram em /var/Backup, o diretório que a ferramenta de backup
# da empresa já leva. A pasta-mãe é só garantida: dono e permissões dela
# ficam como estão.
- name: Garantir o diretório /var/Backup
  ansible.builtin.file:
    path: "{{ backup_dir | dirname }}"
    state: directory

# Até a 1.1.0 eles ficavam em /var/backup (minúsculo). Os arquivos que já
# estão lá vão para o lugar novo — o banco guarda só o nome, então o
# histórico do console continua apontando para eles — e a pasta antiga sai
# se ficar vazia.
- name: Mover os backups do lugar antigo
  ansible.builtin.shell:
    cmd: |
      antigo=/var/backup/pabx-telium
      [ -d "$antigo" ] && [ "$antigo" != "{{ backup_dir }}" ] || exit 0
      mkdir -p "{{ backup_dir }}"
      movidos=0
      for f in "$antigo"/telium-*.tar.gz; do
        [ -f "$f" ] || continue
        if [ ! -e "{{ backup_dir }}/$(basename "$f")" ]; then
          mv "$f" "{{ backup_dir }}/" && movidos=$((movidos+1))
        fi
      done
      rmdir "$antigo" 2>/dev/null
      rmdir /var/backup 2>/dev/null
      echo "movidos=$movidos"
  register: backup_mudanca
  changed_when: "(backup_mudanca.stdout | default('')) not in ['', 'movidos=0']"

# A API precisa atravessar o /var/Backup para chegar aos arquivos (Baixar,
# envio ao destino remoto). Se a pasta-mãe estiver fechada só para o root,
# ela ganha, por ACL, apenas o "atravessar" para o usuário da API — sem
# listar nem ler o que mais houver ali, e sem mudar dono nem modo dela.
- name: Conferir se a API alcança o /var/Backup
  ansible.builtin.command:
    cmd: runuser -u {{ telium_user }} -- test -x "{{ backup_dir | dirname }}"
  register: backup_atravessa
  changed_when: false
  failed_when: false

- name: Instalar as ferramentas de ACL
  ansible.builtin.apt:
    name: acl
    state: present
  when: backup_atravessa.rc != 0

- name: Deixar a API atravessar o /var/Backup
  ansible.builtin.command:
    cmd: setfacl -m u:{{ telium_user }}:x "{{ backup_dir | dirname }}"
  when: backup_atravessa.rc != 0

# A API lê (Baixar, envio ao destino remoto); só o root escreve, porque a
# restauração, que roda como root, confia no que estiver aqui.
- name: Criar diretório de backups
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: root
    group: "{{ telium_user }}"
    mode: "0750"

# O que a central precisa para voltar só copiando os arquivos de volta,
# num bloco marcado dentro do arquivo da ferramenta da empresa — as
# outras linhas ficam como estão.
#   /etc /home /root /opt     sistema, contas, ajustes da central (/etc/telium-servidor.yml), clone e o
#                             código publicado (api/.env)
#   /Telium                   a pasta da empresa nos servidores
#   /usr/local/sbin           os executores da central (backup, certificados…)
#   /var/Backup               o banco em dump consistente; o /var/lib/mysql
#                             cru, copiado com o MariaDB rodando, não volta
#   /var/spool/asterisk       gravações, recados, caixas postais e fax
#   /var/lib/asterisk         áudios, música de espera, chaves e a base
#                             interna (siga-me, desvio, não perturbe)
- name: Procurar a lista do backup da empresa
  ansible.builtin.stat:
    path: "{{ backup_empresa_lista }}"
  register: backup_empresa
  when: backup_empresa_lista | default('') | length > 0

# Só o que o arquivo ainda não leva: uma linha que já está lá fora do
# bloco — ou um diretório acima dela (I /var/lib cobre /var/lib/asterisk) —
# não se repete aqui. Se tudo já estiver no arquivo, o bloco nem aparece.
- name: Ler a lista do backup da empresa
  ansible.builtin.slurp:
    src: "{{ backup_empresa_lista }}"
  register: backup_empresa_conteudo
  when:
    - backup_empresa_lista | default('') | length > 0
    - backup_empresa.stat.exists | default(false)

- name: Ver o que falta na lista do backup da empresa
  ansible.builtin.set_fact:
    backup_empresa_faltando: >-
      {%- set fora = (backup_empresa_conteudo.content | b64decode)
            | regex_replace('(?s)# BEGIN Telium PABX.*?# END Telium PABX[^\n]*\n?', '') -%}
      {%- set existentes = [] -%}
      {%- for linha in fora.splitlines() -%}
        {%- set partes = linha.split() -%}
        {%- if partes | length >= 2 and partes[0] == 'I' -%}
          {%- set _ = existentes.append(partes[1].rstrip('/') or '/') -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set faltando = [] -%}
      {%- for d in backup_empresa_essencial -%}
        {%- set ns = namespace(tem=false) -%}
        {%- for e in existentes -%}
          {%- if e == '/' or d == e or d.startswith(e ~ '/') -%}{%- set ns.tem = true -%}{%- endif -%}
        {%- endfor -%}
        {%- if not ns.tem -%}{%- set _ = faltando.append(d) -%}{%- endif -%}
      {%- endfor -%}
      {{ faltando }}
  vars:
    backup_empresa_essencial:
      - /etc
      - /home
      - /root
      - /Telium
      - /opt
      - /usr/local/sbin
      - "{{ backup_dir | dirname }}"
      - /var/spool/asterisk
      - /var/lib/asterisk
  when: backup_empresa_conteudo.content is defined

- name: Pôr no backup da empresa o que falta da central
  ansible.builtin.blockinfile:
    path: "{{ backup_empresa_lista }}"
    marker: "# {mark} Telium PABX — gerado pelo Ansible, não edite este bloco"
    create: false
    state: "{{ 'present' if (backup_empresa_faltando | length > 0) else 'absent' }}"
    block: "{{ backup_empresa_faltando | map('regex_replace', '^', 'I ') | join('\n') }}"
  when: backup_empresa_faltando is defined

- name: Instalar o executor de backup
  ansible.builtin.template:
    src: telium-backup.j2
    dest: /usr/local/sbin/telium-backup
    owner: root
    group: root
    mode: "0750"

# Regra de sudo sem curinga nenhum: a API dispara o executor, que decide
# o que fazer lendo o banco. Nenhum argumento é aceito.
- name: Permitir que a API dispare o backup
  ansible.builtin.copy:
    dest: /etc/sudoers.d/telium-backup
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      # Gerado pelo Ansible — Telium PABX. Não edite à mão.
      {{ telium_user }} ALL=(root) NOPASSWD: /usr/local/sbin/telium-backup

- name: Instalar a unidade de backup
  ansible.builtin.copy:
    dest: /etc/systemd/system/telium-backup.service
    mode: "0644"
    content: |
      # Gerado pelo Ansible — Telium PABX. Não edite à mão.
      [Unit]
      Description=Telium PABX — backup
      After=mariadb.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/telium-backup
      Nice=10
      IOSchedulingClass=idle
  notify: recarregar systemd

- name: Instalar o temporizador de backup
  ansible.builtin.copy:
    dest: /etc/systemd/system/telium-backup.timer
    mode: "0644"
    content: |
      # Gerado pelo Ansible — Telium PABX. Não edite à mão.
      [Unit]
      Description=Verifica rotinas de backup a cada minuto

      [Timer]
      OnCalendar=*:0/1
      AccuracySec=30s
      Persistent=true

      [Install]
      WantedBy=timers.target
  notify: recarregar systemd

- name: Aplicar mudanças de unidade antes de habilitar
  ansible.builtin.meta: flush_handlers

- name: Habilitar o temporizador de backup
  ansible.builtin.systemd_service:
    name: telium-backup.timer
    state: started
    enabled: true
    daemon_reload: true

- name: Criar diretório de áudios do sistema
  ansible.builtin.file:
    path: "{{ audios_dir }}"
    state: directory
    owner: "{{ telium_user }}"
    group: asterisk
    mode: "02775"

- name: Instalar utilitários de áudio
  ansible.builtin.apt:
    name:
      - sox
      - libsox-fmt-all
    state: present

# O banco só entra inteiro no backup da empresa se houver um dump recente
# em /var/Backup. A rotina diária vem desligada de fábrica; sem nenhuma
# rotina automática ligada, o playbook liga a de fábrica (a hora fica a
# do cadastro, 03:00 se ninguém mudou). Quem já tem a sua, fica com ela.
- name: Ligar a rotina diária de backup se nenhuma estiver ligada
  ansible.builtin.command:
    cmd: >-
      mariadb --protocol=socket -uroot -N -B {{ db_nome }} -e
      "UPDATE backup_rotinas SET ativo = 1 WHERE id = 1 AND NOT EXISTS
       (SELECT 1 FROM (SELECT id FROM backup_rotinas WHERE ativo = 1 AND periodicidade <> 'manual') r);
       SELECT ROW_COUNT();"
  register: backup_rotina
  changed_when: (backup_rotina.stdout | default('0') | trim | last) == '1'
  failed_when: false
  when: backup_ligar_rotina | default(true) | bool

