---
- name: Conferir se a distribuição é suportada
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
    fail_msg: >-
      Este playbook foi feito para Debian 13+ (também roda em Ubuntu 24.04 para teste).
      Detectado: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
    success_msg: "{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }} — ok"

- name: Avisar quando não for Debian 13+
  ansible.builtin.debug:
    msg: >-
      ATENÇÃO: alvo homologado é Debian 13 (trixie).
      Aqui é {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }};
      os repositórios serão ajustados automaticamente.
  when: not (ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version | int >= 13)

- name: Atualizar índice do apt
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Instalar utilitários base
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - rsync
      - unzip
      - jq
      - sudo
      - chrony
      - locales
      - acl
      - lsof
      - iproute2
      - tcpdump
      - vim
    state: present

- name: Definir fuso horário
  ansible.builtin.command: "timedatectl set-timezone {{ pabx_timezone }}"
  changed_when: false
  failed_when: false

- name: Gerar locale pt_BR.UTF-8
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*pt_BR.UTF-8 UTF-8'
    line: 'pt_BR.UTF-8 UTF-8'
    state: present
  notify: gerar locales

- name: Verificar se a conta de serviço já existe
  ansible.builtin.getent:
    database: passwd
    key: "{{ telium_user }}"
    fail_key: false

- name: Registrar existência da conta de serviço
  ansible.builtin.set_fact:
    conta_servico_existe: "{{ (ansible_facts.getent_passwd[telium_user] | default(None)) is not none }}"

- name: Criar grupo do sistema
  ansible.builtin.group:
    name: "{{ telium_group }}"
    system: true

# Criamos a conta apenas se ela não existir. Alterar uma conta em uso
# faz o usermod falhar ("user is currently used by process N"), e mexer
# numa conta de login que já estava na máquina seria errado de qualquer forma.
- name: Criar conta de serviço
  ansible.builtin.user:
    name: "{{ telium_user }}"
    group: "{{ telium_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ telium_base }}"
    create_home: false
  when: not conta_servico_existe

- name: Garantir que a conta de serviço pertence ao grupo correto
  ansible.builtin.command: "usermod -a -G {{ telium_group }} {{ telium_user }}"
  when: conta_servico_existe
  changed_when: false
  failed_when: false

- name: Avisar sobre conta preexistente
  ansible.builtin.debug:
    msg: >-
      A conta {{ telium_user }} já existia nesta máquina e foi reaproveitada,
      sem alterar shell nem diretório home.
  when: conta_servico_existe

- name: Criar diretórios da aplicação
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ telium_user }}"
    group: "{{ telium_group }}"
    mode: "0755"
  loop:
    - "{{ telium_base }}"
    - "{{ telium_web }}"
    - "{{ telium_api }}"
    - "{{ telium_etc }}"
    - "{{ telium_log }}"
    - "{{ src_dir }}"

- name: Registrar hostname do PABX em /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ pabx_hostname }}$'
    line: "127.0.1.1 {{ pabx_hostname }}"
    state: present

# ------------------------------------------------------------------
# Certificado TLS (nginx e Janus usam o mesmo par)
# ------------------------------------------------------------------
- name: Instalar pacote ssl-cert (fornece o grupo ssl-cert)
  ansible.builtin.apt:
    name: ssl-cert
    state: present

- name: Criar diretório de certificados
  ansible.builtin.file:
    path: /etc/ssl/telium
    state: directory
    owner: root
    group: ssl-cert
    mode: "0750"

# A central mudou de nome (ou era a de fábrica e ganhou o nome do
# cliente): o par de fábrica ainda leva o nome antigo, e o "creates"
# abaixo nunca o refaria. Ele é refeito; o par ATIVO só acompanha se for
# o de fábrica — um certificado enviado pelo console não é tocado.
- name: Ler o nome do par de fábrica atual
  ansible.builtin.command: "openssl x509 -in {{ tls_fabrica_cert }} -noout -ext subjectAltName"
  register: fabrica_nome
  changed_when: false
  failed_when: false
  when: tls_autoassinado

- name: O par de fábrica é deste nome?
  ansible.builtin.set_fact:
    fabrica_trocar: >-
      {{ tls_autoassinado and fabrica_nome.rc | default(1) == 0
         and ('DNS:' ~ pabx_hostname) not in fabrica_nome.stdout
         and ('IP Address:' ~ pabx_hostname) not in fabrica_nome.stdout }}

# Todas as linhas com o mesmo recuo: no ">-" do YAML, uma linha mais
# recuada mantém a quebra, e o comando chegava partido ao shell.
- name: O par ativo é o de fábrica?
  ansible.builtin.shell: >-
    ativo=$(openssl x509 -in {{ tls_cert }} -noout -fingerprint -sha256 2>/dev/null);
    fabrica=$(openssl x509 -in {{ tls_fabrica_cert }} -noout -fingerprint -sha256 2>/dev/null);
    [ -n "$ativo" ] && [ "$ativo" = "$fabrica" ]
  register: ativo_de_fabrica
  changed_when: false
  failed_when: false
  when: fabrica_trocar | bool

- name: Descartar o par de fábrica do nome antigo
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ tls_fabrica_cert }}"
    - "{{ tls_fabrica_key }}"
  when: fabrica_trocar | bool

# O par de fábrica nunca é substituído pelo console: ele é a rede de
# segurança para onde o sistema volta se um certificado enviado der errado.
# O nome vai como DNS ou, quando é um IP, como IP — assim o navegador
# confere o que foi digitado.
- name: Gerar o par de fábrica autoassinado
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -nodes -newkey rsa:2048 -days 3650
      -keyout {{ tls_fabrica_key }} -out {{ tls_fabrica_cert }}
      -subj "/C=BR/ST=SP/L=Sao Paulo/O={{ pabx_empresa }}/CN={{ pabx_hostname }}"
      -addext "subjectAltName={{ ('IP:' if pabx_hostname is match('^[0-9.]+$') else 'DNS:') ~ pabx_hostname }},DNS:localhost,IP:127.0.0.1,IP:{{ ansible_facts.default_ipv4.address | default('127.0.0.1') }}"
    creates: "{{ tls_fabrica_cert }}"
  when: tls_autoassinado

# O par ativo começa igual ao de fábrica. force: false para não pisar em
# cima de um certificado já aplicado pelo console numa execução anterior.
- name: Instalar o par ativo a partir do de fábrica
  ansible.builtin.copy:
    src: "{{ item.origem }}"
    dest: "{{ item.destino }}"
    remote_src: true
    force: false
    owner: root
    group: ssl-cert
    mode: "{{ item.modo }}"
  loop:
    - { origem: "{{ tls_fabrica_cert }}", destino: "{{ tls_cert }}", modo: "0644" }
    - { origem: "{{ tls_fabrica_key }}",  destino: "{{ tls_key }}",  modo: "0640" }
  loop_control:
    label: "{{ item.destino }}"
  when: tls_autoassinado

# Com o nome novo, o par ativo que era o de fábrica passa a ser o novo de
# fábrica. O force: false de cima não o trocaria.
- name: Trocar o par ativo pelo de fábrica com o nome novo
  ansible.builtin.copy:
    src: "{{ item.origem }}"
    dest: "{{ item.destino }}"
    remote_src: true
    force: true
    owner: root
    group: ssl-cert
    mode: "{{ item.modo }}"
  loop:
    - { origem: "{{ tls_fabrica_cert }}", destino: "{{ tls_cert }}", modo: "0644" }
    - { origem: "{{ tls_fabrica_key }}",  destino: "{{ tls_key }}",  modo: "0640" }
  loop_control:
    label: "{{ item.destino }}"
  when: (fabrica_trocar | bool) and (ativo_de_fabrica.rc | default(1) == 0)
  notify: recarregar nginx

- name: Ajustar permissões dos certificados
  ansible.builtin.file:
    path: "{{ item.caminho }}"
    owner: root
    group: ssl-cert
    mode: "{{ item.modo }}"
  loop:
    - { caminho: "{{ tls_cert }}",         modo: "0644" }
    - { caminho: "{{ tls_key }}",          modo: "0640" }
    - { caminho: "{{ tls_fabrica_cert }}", modo: "0644" }
    - { caminho: "{{ tls_fabrica_key }}",  modo: "0640" }
  loop_control:
    label: "{{ item.caminho }}"
  when: tls_autoassinado
