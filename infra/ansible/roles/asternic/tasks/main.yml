---
# Asternic Call Center Stats PRO, integrado ao Telium.
#
# O instalador do fornecedor (make install) pressupõe Apache, cria o banco
# com usuário de senha fixa e permissão SUPER, deixa o login admin/admin e
# carrega o ionCube em todo PHP da máquina. Aqui ele vira parte da central:
#
#   · o pacote vem do site oficial, na versão de asternic_versao — os
#     arquivos não vão para o Git, porque a licença proíbe redistribuir;
#   · a tela fica em {{ asternic_dir }}/stats, servida pelo nginx em /stats/,
#     num pool do PHP-FPM próprio, com usuário próprio: o código fechado
#     não enxerga as senhas da API nem do Telium;
#   · o /stats/ só abre para quem está logado no console com a permissão
#     Call Center › Stats (o nginx pergunta à API a cada acesso);
#   · banco qstats com usuário e senha aleatória por central, sem SUPER;
#   · o Asterisk grava o queue_log também em arquivo (papel asterisk), e o
#     serviço asterniclog o lê para o banco qstats.
#   · o admin do Asternic entra com a senha do admin do console, o AMI e
#     o cron dos relatórios agendados já ficam configurados: o único passo
#     à mão é o código de ativação da licença, na primeira abertura.
#
# Atualizar: troque asternic_versao e rode o playbook. A licença
# (asterniclic.php), o config.php e as personalizações ficam.

- name: Instalar o que o Asternic usa
  ansible.builtin.apt:
    name:
      - php8.4-xml
      - php8.4-apcu
      - php8.4-mysql
      - php8.4-ldap
      - libdbi-perl
      - libdbd-mysql-perl
      - rsync
      - cron
    state: present

- name: Criar o usuário do Asternic
  ansible.builtin.user:
    name: asternic
    system: true
    shell: /usr/sbin/nologin
    home: "{{ asternic_dir }}"
    create_home: false

- name: Criar as pastas do Asternic
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: asternic
    group: nginx
    mode: "0750"
  loop:
    - "{{ asternic_dir }}"
    - "{{ asternic_dir }}/stats"

# A sessão do PHP e o log de erros do Asternic são dele, fora das pastas do
# usuário da API (/var/lib/php e /var/log/telium, que ele nem atravessa).
# Sem gravar a sessão, o Asternic conferia a senha, não conseguia guardar o
# login e voltava para a tela de senha — como se ela estivesse errada.
- name: Pastas de sessão e de log do Asternic
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: asternic
    group: asternic
    mode: "0700"
  loop:
    - /var/lib/asternic
    - /var/lib/asternic/sessoes
    - /var/log/asternic

# A tentativa anterior (1.2.2) ficou dentro do /var/lib/php, que o usuário
# do Asternic não atravessa.
- name: Tirar a pasta de sessão antiga do Asternic
  ansible.builtin.file:
    path: /var/lib/php/sessions-asternic
    state: absent

# ------------------------------------------------------------------
# Os pacotes vêm do próprio projeto, em roles/asternic/files/:
#   · asternic-stats-pro-<versão>.tgz — o pacote do fornecedor;
#   · ioncube/ioncube_loader_lin_8.4.so e ioncube/LICENSE.txt.
# A instalação não depende dos sites da Asternic nem da ionCube. Só se o
# arquivo faltar (versão nova ainda não posta no projeto) ele é baixado.
# O pacote do Asternic é comercial: o repositório tem de ser privado.
# A ativação da licença, na primeira abertura, continua falando com a
# Asternic — é ela que emite a licença para o MAC do servidor.
# ------------------------------------------------------------------
- name: Onde estão os pacotes do Asternic no projeto
  ansible.builtin.set_fact:
    asternic_pacote_local: "{{ role_path }}/files/asternic-stats-pro-{{ asternic_versao }}.tgz"
    ioncube_local: "{{ role_path }}/files/ioncube/ioncube_loader_lin_8.4.so"

# ionCube: o Asternic é distribuído codificado. O carregador entra no
# PHP-FPM (onde a tela roda); a linha de comando só o usa quando o
# playbook roda o update_db.php, com as configurações do FPM.
- name: Pasta do carregador ionCube
  ansible.builtin.file:
    path: /usr/local/ioncube
    state: directory
    mode: "0755"

- name: Carregador ionCube do projeto
  ansible.builtin.copy:
    src: "{{ role_path }}/files/ioncube/{{ item }}"
    dest: "/usr/local/ioncube/{{ item }}"
    mode: "0644"
  loop:
    - ioncube_loader_lin_8.4.so
    - LICENSE.txt
  when: ioncube_local is file
  notify: reiniciar php-fpm

- name: Baixar o carregador ionCube (não está no projeto)
  ansible.builtin.get_url:
    url: "{{ ioncube_url }}"
    dest: "{{ src_dir }}/ioncube_loaders_lin_x86-64.tar.gz"
    mode: "0644"
  when: ioncube_local is not file

- name: Extrair o carregador ionCube baixado
  ansible.builtin.unarchive:
    src: "{{ src_dir }}/ioncube_loaders_lin_x86-64.tar.gz"
    dest: /usr/local
    remote_src: true
    creates: /usr/local/ioncube/ioncube_loader_lin_8.4.so
  when: ioncube_local is not file

- name: Carregar o ionCube no PHP-FPM
  ansible.builtin.copy:
    dest: /etc/php/8.4/fpm/conf.d/00-ioncube.ini
    content: |
      ; Gerado pelo Ansible — Telium PABX (Asternic). Não edite à mão.
      zend_extension=/usr/local/ioncube/ioncube_loader_lin_8.4.so
    mode: "0644"
  notify: reiniciar php-fpm

# ------------------------------------------------------------------
# O pacote do fornecedor
# ------------------------------------------------------------------
- name: Pacote do Asternic {{ asternic_versao }} do projeto
  ansible.builtin.copy:
    src: "{{ asternic_pacote_local }}"
    dest: "{{ src_dir }}/asternic-stats-pro-{{ asternic_versao }}.tgz"
    mode: "0644"
  when: asternic_pacote_local is file

- name: Baixar o Asternic {{ asternic_versao }} (não está no projeto)
  ansible.builtin.get_url:
    url: "{{ asternic_url }}"
    dest: "{{ src_dir }}/asternic-stats-pro-{{ asternic_versao }}.tgz"
    mode: "0644"
  when: asternic_pacote_local is not file

- name: Extrair o Asternic
  ansible.builtin.unarchive:
    src: "{{ src_dir }}/asternic-stats-pro-{{ asternic_versao }}.tgz"
    dest: "{{ src_dir }}"
    remote_src: true
    creates: "{{ src_dir }}/asternic-stats-pro-{{ asternic_versao }}/html/config.php"

# A cópia preserva o que é da central: a licença ativada, o config.php e as
# personalizações. Na primeira vez eles vêm do pacote; depois, ficam.
- name: Publicar a tela do Asternic
  ansible.builtin.shell:
    cmd: |
      origem="{{ src_dir }}/asternic-stats-pro-{{ asternic_versao }}/html/"
      destino="{{ asternic_dir }}/stats/"
      rsync -a --itemize-changes \
        --exclude config.php --exclude custom.php --exclude asterniclic.php \
        --exclude css/custom.css --exclude js/custom.js \
        "$origem" "$destino"
      for f in config.php custom.php css/custom.css js/custom.js; do
        [ -e "$destino$f" ] || { cp -p "$origem$f" "$destino$f" && echo "novo $f"; }
      done
      chown -R asternic:nginx "$destino"
      find "$destino" -type d -exec chmod 0750 {} +
      find "$destino" -type f -exec chmod 0640 {} +
  register: asternic_web
  changed_when: asternic_web.stdout | length > 0

- name: Configurar o banco e o AMI do Asternic
  ansible.builtin.replace:
    path: "{{ asternic_dir }}/stats/config.php"
    regexp: "{{ item.de }}"
    replace: "{{ item.para }}"
  loop:
    - { de: "^\\$DBUSER\\s*=.*$",          para: "$DBUSER = 'qstatsUser';" }
    - { de: "^\\$DBPASS\\s*=.*$",          para: "$DBPASS = '{{ asternic_db_senha }}';" }
    - { de: "^\\$MANAGER_HOST\\s*=.*$",    para: "$MANAGER_HOST   = \"127.0.0.1\";" }
    - { de: "^\\$MANAGER_USER\\s*=.*$",    para: "$MANAGER_USER   = \"asternic\";" }
    - { de: "^\\$MANAGER_SECRET\\s*=.*$",  para: "$MANAGER_SECRET = \"{{ asternic_ami_senha }}\";" }
    - { de: "^\\$REST_PASS\\s*=.*$",       para: "$REST_PASS = \"{{ asternic_db_senha | hash('sha1') }}\";" }
    - { de: "^(//)?\\s*\\$REST_URL\\s*=.*$", para: "$REST_URL  = \"http://127.0.0.1\";" }
  loop_control:
    label: "{{ item.de | regex_replace('[^A-Z_]', '') }}"
  no_log: true

# ------------------------------------------------------------------
# Banco qstats: usuário próprio, sem SUPER (o instalador do fornecedor
# dava SUPER em tudo e uma senha que está no manual dele).
# ------------------------------------------------------------------
- name: Ver se o banco do Asternic já existe
  ansible.builtin.command:
    cmd: mariadb --protocol=socket -uroot -N -B -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'qstats'"
  register: asternic_tabelas
  changed_when: false

- name: Criar o banco do Asternic
  ansible.builtin.shell:
    cmd: |
      mariadb --protocol=socket -uroot -e "CREATE DATABASE IF NOT EXISTS qstats DEFAULT CHARACTER SET utf8"
      mariadb --protocol=socket -uroot qstats < "{{ src_dir }}/asternic-stats-pro-{{ asternic_versao }}/sql/mysql-tables.sql"
      mariadb --protocol=socket -uroot qstats < "{{ src_dir }}/asternic-stats-pro-{{ asternic_versao }}/sql/trigger.sql"
  when: (asternic_tabelas.stdout | trim | int) == 0

- name: Usuário do banco do Asternic
  ansible.builtin.shell:
    cmd: >-
      mariadb --protocol=socket -uroot -e "
      CREATE USER IF NOT EXISTS 'qstatsUser'@'localhost' IDENTIFIED BY '{{ asternic_db_senha }}';
      ALTER USER 'qstatsUser'@'localhost' IDENTIFIED BY '{{ asternic_db_senha }}' ACCOUNT UNLOCK;
      GRANT ALL PRIVILEGES ON qstats.* TO 'qstatsUser'@'localhost';"
  changed_when: false
  no_log: true

# Quem rodou o "make install" do fornecedor antes ficou com SUPER: sai.
# Sem a permissão, o MariaDB reclama, e isso é o esperado.
- name: Tirar o SUPER que o instalador do fornecedor dava
  ansible.builtin.command:
    cmd: mariadb --protocol=socket -uroot -e "REVOKE SUPER ON *.* FROM 'qstatsUser'@'localhost'"
  changed_when: false
  failed_when: false

# O update_db.php do fornecedor acrescenta às tabelas o que a versão
# instalada usa — entre outras, as colunas auth_type e active de "users".
# Sem elas o login responde "Bad username or password" com a senha certa
# (foi o que aconteceu até a 1.2.4). Ele não mexe nas senhas.
#
# O carregador ionCube tem de ser a primeira extensão do PHP; na linha de
# comando o opcache entra antes e o "-d zend_extension=" morre com "The
# Loader must appear as the first entry". As configurações do PHP-FPM já
# têm o 00-ioncube.ini na frente — o update_db.php roda com elas.
- name: Atualizar as tabelas do Asternic para a versão instalada
  ansible.builtin.command:
    cmd: php {{ asternic_dir }}/stats/update_db.php
    chdir: "{{ asternic_dir }}/stats"
  environment:
    PHP_INI_SCAN_DIR: /etc/php/8.4/fpm/conf.d
  register: asternic_update
  changed_when: false
  failed_when: >-
    asternic_update.rc != 0
    or 'Fatal error' in asternic_update.stdout
    or 'Fatal error' in asternic_update.stderr

- name: Conferir as tabelas do Asternic
  ansible.builtin.command:
    cmd: >-
      mariadb --protocol=socket -uroot -N -B -e "SELECT COUNT(*) FROM information_schema.columns
      WHERE table_schema = 'qstats' AND table_name = 'users' AND column_name IN ('auth_type', 'active')"
  register: asternic_colunas
  changed_when: false
  failed_when: (asternic_colunas.stdout | trim | int) != 2

# O admin do Asternic entra com a mesma senha do admin do console
# (senha_padrao_console). Gravada uma vez por central: se alguém trocar a
# senha dentro do Asternic, o playbook não a desfaz. O SHA1 é o formato
# que o instalador do fornecedor grava e que o login confere.
- name: Senha do admin do Asternic igual à do admin do console
  ansible.builtin.command:
    cmd: mariadb --protocol=socket -uroot qstats
    stdin: >-
      UPDATE users SET password = SHA1('{{ senha_padrao_console | replace("\\", "\\\\") | replace("'", "''") }}'),
      auth_type = 'local', active = 1 WHERE login = 'admin';
    creates: "{{ telium_etc }}/.asternic-admin-console"
  register: asternic_admin
  no_log: true

- name: Marcar a senha do admin do Asternic como gravada
  ansible.builtin.file:
    path: "{{ telium_etc }}/.asternic-admin-console"
    state: touch
    mode: "0600"
  when: asternic_admin is changed

# A senha aleatória das versões 1.2.0 a 1.2.5 deixou de valer.
- name: Tirar a senha antiga do admin do Asternic
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ credenciais_dir }}/asternic_admin_senha"
    - "{{ telium_etc }}/.asternic-admin-inicial"

# Em toda execução, junto com o $REST_PASS do config.php: o restUser é o
# usuário que os relatórios agendados usam para pedir o relatório à tela.
# E usuário de exemplo ("user", "supervisor") com a senha igual ao nome
# ganha uma que ninguém conhece.
- name: Usuário dos relatórios agendados e usuários de exemplo do Asternic
  ansible.builtin.shell:
    cmd: >-
      mariadb --protocol=socket -uroot qstats -e "
      UPDATE users SET password = SHA1('{{ asternic_db_senha | hash('sha1') }}') WHERE login = 'restUser';
      UPDATE users SET password = SHA1(UUID())
      WHERE (login = 'user' AND password = SHA1('user')) OR (login = 'supervisor' AND password = SHA1('supervisor'))"
  changed_when: false
  no_log: true

# O tempo real do Asternic não usa o $MANAGER_* do config.php: usa a
# tabela "ami" (Setup › AMI Servers), que nasce com localhost/admin/amp111
# — e a tela dizia "Could not connect to the Asterisk Manager Interface".
# A linha da própria central passa a usar o usuário "asternic" do
# manager.conf, em 127.0.0.1 (o AMI só escuta no IPv4; "localhost" pode
# virar ::1). Outros servidores cadastrados à mão ficam como estão.
- name: Servidor AMI da central no Asternic
  ansible.builtin.shell:
    cmd: >-
      mariadb --protocol=socket -uroot qstats -e "
      UPDATE ami SET server = '127.0.0.1', user = 'asternic', secret = '{{ asternic_ami_senha }}'
      WHERE server IN ('localhost', '127.0.0.1', '127.0.0.1:{{ ami_porta }}', 'localhost:{{ ami_porta }}');
      INSERT INTO ami (server, name, user, secret)
      SELECT '127.0.0.1', 'Local', 'asternic', '{{ asternic_ami_senha }}' FROM DUAL
      WHERE NOT EXISTS (SELECT 1 FROM ami WHERE server = '127.0.0.1');
      INSERT INTO userami (users_id, ami_ami_id)
      SELECT u.id, a.ami_id FROM users u JOIN ami a ON a.server = '127.0.0.1'
      WHERE NOT EXISTS (SELECT 1 FROM userami x WHERE x.users_id = u.id AND x.ami_ami_id = a.ami_id);"
  changed_when: false
  no_log: true

# ------------------------------------------------------------------
# asterniclog: lê o queue_log (arquivo) e grava no banco qstats
# ------------------------------------------------------------------
# Do jeito do instalador do fornecedor (install -m 755 parselog/*), por
# rsync. O copy com remote_src deixava a central sem o
# /usr/local/parselog/asterniclog, e o serviço reiniciava sem parar com
# "Unable to locate executable". A tarefa agora confere o arquivo.
- name: Publicar os scripts do Asternic
  ansible.builtin.shell:
    cmd: |
      set -e
      install -d -m 0755 /usr/local/parselog
      rsync -a --chmod=D0755,F0755 --itemize-changes \
        "{{ src_dir }}/asternic-stats-pro-{{ asternic_versao }}/parselog/" /usr/local/parselog/
      test -x /usr/local/parselog/asterniclog
      test -f /usr/local/parselog/Tail.pm
  register: asternic_parselog
  changed_when: asternic_parselog.stdout | length > 0
  notify: reiniciar asterniclog

- name: Opções do asterniclog
  ansible.builtin.copy:
    dest: /etc/default/asterniclog
    owner: root
    group: root
    mode: "0600"
    content: |
      # Gerado pelo Ansible — Telium PABX. Não edite à mão.
      OPTIONS="-u qstatsUser -p {{ asternic_db_senha }} -d qstats -h localhost -l /var/log/asterisk/queue_log --daemon"
  no_log: true
  notify: reiniciar asterniclog

- name: Serviço asterniclog
  ansible.builtin.copy:
    dest: /etc/systemd/system/asterniclog.service
    mode: "0644"
    content: |
      # Gerado pelo Ansible — Telium PABX. Não edite à mão.
      [Unit]
      Description=Asternic — leitura do queue_log para o banco qstats
      After=network.target mariadb.service asterisk.service

      [Service]
      EnvironmentFile=-/etc/default/asterniclog
      ExecStart=/usr/local/parselog/asterniclog $OPTIONS
      Type=forking
      PIDFile=/var/run/asterniclog.pid
      Restart=on-failure
      RestartSec=10

      [Install]
      WantedBy=multi-user.target
  notify: reiniciar asterniclog

# O asterniclog sai com erro se o queue_log ainda não existe em arquivo. O
# papel asterisk já ligou o queue_log_to_file, mas o Asterisk só relê o
# logger.conf no fim do playbook (handler) — então: relê agora e, sem
# nenhum evento de fila ainda, o arquivo nasce vazio.
- name: Fazer o Asterisk gravar o queue_log em arquivo agora
  ansible.builtin.command:
    cmd: asterisk -rx "logger reload"
  changed_when: false
  failed_when: false

- name: Garantir o arquivo do queue_log
  ansible.builtin.file:
    path: /var/log/asterisk/queue_log
    state: touch
    owner: asterisk
    group: asterisk
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Ligar o asterniclog
  ansible.builtin.systemd_service:
    name: asterniclog
    enabled: true
    state: started
    daemon_reload: true

# ------------------------------------------------------------------
# Histórico: o arquivo do queue_log só existe desde que o Asternic foi
# instalado, mas a central grava o queue_log no banco desde sempre. Uma
# vez só, o que é anterior ao arquivo vai para o qstats — sem isso, o
# Asternic só conhece os agentes e as filas que tiveram evento depois da
# instalação. O asterniclog para durante a carga (que pode demorar numa
# central com muito histórico) e volta em seguida.
# ------------------------------------------------------------------
- name: Trazer o histórico de filas da central para o Asternic
  ansible.builtin.shell:
    cmd: |
      set -eu
      hist=/var/lib/asternic/queue_log-historico
      corte=$(head -n 1 /var/log/asterisk/queue_log | cut -d'|' -f1)
      case "$corte" in ''|*[!0-9]*) corte=$(date +%s) ;; esac
      mariadb --protocol=socket -uroot -N -B -r {{ db_nome }} -e "
        SELECT CONCAT_WS('|', FLOOR(UNIX_TIMESTAMP(time)), callid, queuename, agent, event,
                         data1, data2, data3, data4, data5)
        FROM queue_log
        WHERE time IS NOT NULL AND UNIX_TIMESTAMP(time) < $corte
        ORDER BY time, id" | sed -E 's/\|+$//' > "$hist"
      linhas=$(wc -l < "$hist")
      if [ "$linhas" -gt 0 ]; then
        systemctl stop asterniclog
        trap 'systemctl start asterniclog' EXIT
        /usr/local/parselog/asterniclog -u qstatsUser -p '{{ asternic_db_senha }}' -d qstats -h localhost \
          -l "$hist" -r -P /var/lib/asternic/historico.pid > /var/log/asternic/historico.log 2>&1
      fi
      rm -f "$hist" /var/lib/asternic/historico.pid
      touch {{ telium_etc }}/.asternic-historico
      echo "$linhas eventos"
    creates: "{{ telium_etc }}/.asternic-historico"
  register: asternic_historico
  no_log: true

# ------------------------------------------------------------------
# PHP-FPM próprio: o Asternic roda como "asternic", e não como a API
# ------------------------------------------------------------------
- name: Pool do PHP-FPM do Asternic
  ansible.builtin.copy:
    dest: /etc/php/8.4/fpm/pool.d/asternic.conf
    mode: "0644"
    content: |
      ; Gerado pelo Ansible — Telium PABX (Asternic). Não edite à mão.
      [asternic]
      user  = asternic
      group = nginx
      listen       = /run/php/asternic.sock
      listen.owner = nginx
      listen.group = nginx
      listen.mode  = 0660
      pm = ondemand
      pm.max_children = 10
      pm.process_idle_timeout = 60s
      php_admin_value[error_log] = /var/log/asternic/php.log
      php_admin_flag[log_errors] = on
      php_admin_value[session.save_path] = /var/lib/asternic/sessoes
  notify: reiniciar php-fpm

# ------------------------------------------------------------------
# Relatórios agendados e alertas por e-mail (Setup › Schedule): o
# fornecedor pede um cron com o sched_check.php pela linha de comando do
# PHP. Ele roda como "asternic", com o PHP do FPM (por causa do ionCube),
# e busca o relatório na própria tela por http://127.0.0.1/stats/.
# ------------------------------------------------------------------
- name: Cron dos relatórios agendados do Asternic
  ansible.builtin.copy:
    dest: /etc/cron.d/asternic
    owner: root
    group: root
    mode: "0644"
    content: |
      # Gerado pelo Ansible — Telium PABX (Asternic). Não edite à mão.
      SHELL=/bin/sh
      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      * * * * * asternic cd {{ asternic_dir }}/stats && PHP_INI_SCAN_DIR=/etc/php/8.4/fpm/conf.d php -q sched_check.php >/dev/null 2>>/var/log/asternic/agendados.log

- name: Rotação dos logs do Asternic
  ansible.builtin.copy:
    dest: /etc/logrotate.d/asternic
    mode: "0644"
    content: |
      # Gerado pelo Ansible — Telium PABX (Asternic). Não edite à mão.
      /var/log/asternic/*.log {
          weekly
          rotate 4
          compress
          missingok
          notifempty
          copytruncate
          su asternic asternic
      }

- name: Resumo do Asternic
  ansible.builtin.debug:
    msg:
      - "Asternic {{ asternic_versao }} em https://{{ pabx_hostname }}/stats/ (Call Center › Stats)"
      - "{{ 'Pacotes do Asternic e do ionCube: do projeto' if (asternic_pacote_local is file and ioncube_local is file) else 'ATENÇÃO: pacote baixado da internet — ponha-o em roles/asternic/files/' }}"
      - "Login: admin, com a mesma senha do admin do console"
      - "Na primeira vez a tela pede o código de ativação da licença deste servidor."
