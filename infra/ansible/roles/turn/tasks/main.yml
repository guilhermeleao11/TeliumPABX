---
# Servidor TURN (coturn).
#
# O softphone do navegador fala RTP direto com o Asterisk. Em rede
# doméstica e na maioria das empresas o STUN resolve, mas onde a saída
# UDP é bloqueada, ou onde o NAT é simétrico, a chamada conecta e fica
# muda — sem nada no log do Asterisk, porque o problema está entre o
# navegador e a borda da rede do usuário.
#
# O TURN é o plano B: retransmite a mídia por um endereço público, em
# UDP e, quando nem isso passa, em TCP (3478) ou TLS (5349).

- name: Instalar o coturn
  ansible.builtin.apt:
    name: coturn
    state: present
    update_cache: true

- name: Gerar o segredo do TURN
  ansible.builtin.set_fact:
    turn_segredo_efetivo: "{{ turn_segredo | default(lookup('password', credenciais_dir ~ '/turn_segredo chars=' ~ senha_alfabeto ~ ' length=' ~ senha_tamanho), true) }}"

# O coturn do Debian não sobe enquanto este arquivo disser que não.
- name: Liberar a partida do coturn
  ansible.builtin.copy:
    dest: /etc/default/coturn
    owner: root
    group: root
    mode: "0644"
    content: |
      # Gerado pelo Ansible — Telium PABX. Não edite à mão.
      TURNSERVER_ENABLED=1
  notify: reiniciar coturn

# Atrás de NAT o coturn precisa do endereço público. Vale o do
# servidor.yml; sem ele, o que foi gravado no console (Conectividade ›
# Configurações de Rede). Antes só a variável do Ansible chegava aqui, e o
# endereço posto no console ficava no Asterisk e faltava no TURN.
- name: Ler o endereço público gravado no console
  ansible.builtin.command:
    cmd: mariadb --protocol=socket -uroot -N -B {{ db_nome }} -e "SELECT valor FROM sistema WHERE chave = 'rede_ip_publico'"
  register: turn_ip_console
  changed_when: false
  failed_when: false

- name: Escolher o endereço público do TURN
  ansible.builtin.set_fact:
    turn_ip_publico: >-
      {{ nat_ip_publico if (nat_ip_publico | default('') | length > 0)
         else ((turn_ip_console.stdout | default('') | trim)
               if (turn_ip_console.stdout | default('') | trim) is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$') else '') }}

- name: Publicar a configuração do coturn
  ansible.builtin.template:
    src: turnserver.conf.j2
    dest: /etc/turnserver.conf
    owner: root
    group: turnserver
    mode: "0640"
  notify: reiniciar coturn

# O diretório antes do par: na instalação nova o pacote não o cria, e a
# cópia abaixo falhava calada — o coturn subia sem TLS na 5349 até a
# segunda execução do playbook.
- name: Garantir o diretório de certificado do TURN
  ansible.builtin.file:
    path: /etc/coturn
    state: directory
    owner: root
    group: turnserver
    mode: "0750"

# O TURN precisa de TLS na 5349 e o par do console já existe. Ele é
# lido pelo usuário turnserver, que não está no grupo do Asterisk.
#
# force: false — o par de partida entra uma vez só. Depois, quem manda é
# a tela de Certificados (telium-certificados): copiar de novo a cada
# execução desfazia o certificado que o administrador aplicou no TURN,
# com o console ainda dizendo "aplicado".
- name: Publicar o par de certificado do TURN
  ansible.builtin.copy:
    src: "{{ item.origem }}"
    dest: "{{ item.destino }}"
    remote_src: true
    force: false
    owner: root
    group: turnserver
    mode: "{{ item.modo }}"
  loop:
    - { origem: "{{ cert_asterisk_dir }}/asterisk.crt", destino: /etc/coturn/turn.crt, modo: "0644" }
    - { origem: "{{ cert_asterisk_dir }}/asterisk.key", destino: /etc/coturn/turn.key, modo: "0640" }
  failed_when: false
  notify: reiniciar coturn

- name: Habilitar e iniciar o coturn
  ansible.builtin.service:
    name: coturn
    state: started
    enabled: true

# As portas do TURN são abertas pelo papel "seguranca", que é quem
# instala o ufw. Tentar abri-las aqui falhava numa instalação nova: este
# papel roda antes, e o comando ainda não existe na máquina.

- name: Lembrar que o TURN está no ar
  ansible.builtin.debug:
    msg:
      - "TURN no ar em {{ turn_dominio }}:{{ turn_porta }}"
      - "O softphone recebe as credenciais pelo .env da API, que o papel"
      - "api publica em seguida — nada a fazer à mão."
