---
- name: Provisionar o Telium PABX
  hosts: pabx
  become: true
  gather_facts: true

  pre_tasks:
    # ---------- o nome desta central ----------
    # Cada cliente tem o seu, e ele vai para o console, o certificado, o
    # domínio SIP e o TURN. O de fábrica (pabx.telium.local) não serve
    # para nada de verdade — um ".local" nem o navegador resolve —, então
    # enquanto ele estiver valendo a instalação pergunta. A resposta fica
    # guardada no servidor.yml (fora do Git) e as próximas execuções não
    # perguntam mais. Sem terminal: -e pabx_hostname=voz.cliente.com.br
    - name: O nome desta central já foi escolhido?
      ansible.builtin.set_fact:
        pabx_nome_pendente: "{{ (pabx_hostname | default('') | string | trim | lower) in ['', 'pabx.telium.local'] }}"

    - name: Perguntar o nome desta central
      ansible.builtin.pause:
        prompt: |-

          ════════════════════════════════════════════════════════════════
           Qual é o nome deste servidor?

           É o endereço do console (https://<nome>/), o nome no certificado,
           o domínio dos telefones e o do áudio do softphone do navegador.
           Precisa apontar para este servidor no DNS e ser alcançável de
           quem vai usar o console. Ex.: voz.cliente.com.br

           Ainda sem DNS? Digite o IP público do servidor.
          ════════════════════════════════════════════════════════════════
          Nome do servidor
      register: resposta_nome
      when: pabx_nome_pendente

    - name: Usar o nome informado
      ansible.builtin.set_fact:
        pabx_hostname: "{{ resposta_nome.user_input | default('') | trim | lower }}"
      when: pabx_nome_pendente

    - name: Conferir o nome da central
      ansible.builtin.assert:
        that:
          - pabx_hostname | length > 0
          - pabx_hostname is not search('\.local$')
          # Nome no formato que os telefones e o navegador aceitam (RFC 3261:
          # cada parte com letras, números e hífen, a última começando por
          # letra) — ou um IPv4.
          - >-
            (pabx_hostname is match('^(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]([a-z0-9-]{0,61}[a-z0-9])?$'))
            or (pabx_hostname is match('^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$'))
        fail_msg: >-
          O nome "{{ pabx_hostname }}" não serve para a central.
          {% if pabx_hostname | length == 0 %}Nenhum nome foi informado: rodando sem terminal,
          passe o nome com -e pabx_hostname=voz.cliente.com.br.{% elif pabx_hostname is search('\.local$') %}Um
          nome ".local" não é resolvido pelo navegador de quem usa o console, e o softphone
          fica sem áudio. Use o nome do DNS (ex.: voz.cliente.com.br) ou o IP público.{% else %}Use
          um nome como voz.cliente.com.br (letras, números, hífen e pontos; sem "_"; a última
          parte começando por letra) ou um IP.{% endif %}
        quiet: true

    # O servidor.yml vive no clone, na máquina de onde o playbook roda.
    # Uma central por clone: para várias, use host_vars/<servidor>.yml.
    - name: Criar o servidor.yml a partir do modelo
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/group_vars/all/servidor.yml.exemplo"
        dest: "{{ playbook_dir }}/group_vars/all/servidor.yml"
        force: false
        mode: "0644"
      delegate_to: localhost
      run_once: true
      become: false

    - name: Guardar o nome da central no servidor.yml
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/group_vars/all/servidor.yml"
        regexp: '^#?\s*pabx_hostname:'
        line: 'pabx_hostname: "{{ pabx_hostname }}"'
      delegate_to: localhost
      run_once: true
      become: false

    - name: Resumo do que será instalado
      ansible.builtin.debug:
        msg:
          - "Telium PABX 1.0.1"
          - "Nome ...... {{ pabx_hostname }}  (console: https://{{ pabx_hostname }}/)"
          - "Alvo ...... {{ inventory_hostname }} ({{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }})"
          - "Asterisk .. {{ asterisk_versao }} (compilado do fonte)"
          - "Janus ..... {{ janus_versao }} (compilado do fonte)"
          - "TURN ...... coturn (mídia do softphone onde o caminho direto não passa)"
          - "MariaDB ... {{ mariadb_versao }} (repositório oficial)"
          - "nginx ..... canal {{ nginx_canal }} (repositório oficial)"
          - "PHP ....... 8.4 + Slim"
          - ""
          - "Senhas de serviço: geradas nesta instalação e guardadas em"
          - "  {{ credenciais_dir }} (uma por arquivo, 0600, só root)"
          - "Senha do console: a inicial vale até a primeira troca — veja o final"
          - ""
          - "ATENÇÃO: a compilação do Asterisk leva de 5 a 15 minutos."

  roles:
    - common
    - mariadb
    # nginx vem antes do php porque o pool do PHP-FPM usa
    # listen.owner = nginx, e esse usuário nasce com o pacote nginx.
    - nginx
    - php
    - asterisk
    - role: janus
      when: instalar_janus | default(false)
    # O TURN vem antes da API porque o .env da API leva o segredo dele.
    - role: turn
      when: instalar_turn | default(true)
    - backup
    - certificados
    - email
    - api
    # Logs para o syslog central do grupo VoIP (syslog_central).
    - syslog
    - seguranca

  post_tasks:
    - name: Alertar sobre o AMI, se houver problema
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════"
          - "ATENÇÃO: o AMI não autenticou durante a instalação."
          - "Tudo o mais foi publicado, mas aplicar configurações e"
          - "originar chamadas dependem dele."
          - ""
          - "Investigue com:  sudo bash infra/diagnostico-ami.sh"
          - "════════════════════════════════════════════════════════"
      when: not (ami_ok | default(true))

    - name: Proteger o diretório de credenciais
      ansible.builtin.file:
        path: "{{ credenciais_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Registrar um resumo da instalação
      ansible.builtin.copy:
        dest: "{{ telium_etc }}/instalacao.txt"
        owner: root
        group: root
        mode: "0600"
        content: |
          Telium PABX 1.0.1 — instalado em {{ ansible_date_time.iso8601 | default('') }}
          host: {{ inventory_hostname }} ({{ ansible_facts.default_ipv4.address | default('127.0.0.1') }})

          Console ...... https://{{ ansible_facts.default_ipv4.address | default('127.0.0.1') }}/
          Usuário ...... admin
          Senha inicial  {{ senha_padrao_console }}

          A senha inicial vale só até a primeira troca: TROQUE no primeiro
          acesso (canto superior direito › Minha conta). O playbook não volta
          a mexer nela. Perdeu a senha? Pelo terminal do servidor:
            sudo -u {{ telium_user }} php {{ telium_api }}/bin/telium senha admin

          As senhas de serviço (banco, AMI, ARI) foram geradas nesta
          instalação e estão em {{ credenciais_dir }}, uma por arquivo.
          Elas nunca são exibidas na tela nem versionadas.

    - name: Endereços de acesso
      ansible.builtin.debug:
        msg:
          - "Console ....... https://{{ ansible_facts.default_ipv4.address | default('127.0.0.1') }}/"
          - "API ........... https://{{ ansible_facts.default_ipv4.address | default('127.0.0.1') }}/api/health"
          - "Janus ......... https://{{ ansible_facts.default_ipv4.address | default('127.0.0.1') }}/janus/info"
          - ""
          - "Login ......... admin / {{ senha_padrao_console }}  (senha INICIAL)"
          - "  TROQUE no primeiro acesso: o playbook não volta a mexer nela."
          - "  Perdeu? sudo -u {{ telium_user }} php {{ telium_api }}/bin/telium senha admin"
          - "Senhas de serviço em {{ credenciais_dir }} (0600, só root)"
          - "Resumo salvo em {{ telium_etc }}/instalacao.txt"
          - ""
          - "Verificação ... sudo ansible-playbook verificar.yml"
