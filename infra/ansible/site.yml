---
- name: Provisionar o Telium PABX
  hosts: pabx
  become: true
  gather_facts: true

  pre_tasks:
    - name: Resumo do que será instalado
      ansible.builtin.debug:
        msg:
          - "Alvo ...... {{ inventory_hostname }} ({{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }})"
          - "Asterisk .. {{ asterisk_versao }} (compilado do fonte)"
          - "Janus ..... {{ janus_versao }} (compilado do fonte)"
          - "MariaDB ... {{ mariadb_versao }} (repositório oficial)"
          - "nginx ..... canal {{ nginx_canal }} (repositório oficial)"
          - "PHP ....... 8.4 + Slim"
          - ""
          - "Senhas de serviço: geradas nesta instalação e guardadas em"
          - "  {{ credenciais_dir }} (uma por arquivo, 0600, só root)"
          - "Senha do console: fixa — veja o resumo no final"
          - ""
          - "ATENÇÃO: a compilação do Asterisk leva de 5 a 15 minutos."

  roles:
    - common
    - mariadb
    # nginx vem antes do php porque o pool do PHP-FPM usa
    # listen.owner = nginx, e esse usuário nasce com o pacote nginx.
    - nginx
    - php
    - asterisk
    - janus
    - backup
    - certificados
    - api
    - seguranca

  post_tasks:
    - name: Alertar sobre o AMI, se houver problema
      ansible.builtin.debug:
        msg:
          - "════════════════════════════════════════════════════════"
          - "ATENÇÃO: o AMI não autenticou durante a instalação."
          - "Tudo o mais foi publicado, mas aplicar configurações e"
          - "originar chamadas dependem dele."
          - ""
          - "Investigue com:  sudo bash infra/diagnostico-ami.sh"
          - "════════════════════════════════════════════════════════"
      when: not (ami_ok | default(true))

    - name: Proteger o diretório de credenciais
      ansible.builtin.file:
        path: "{{ credenciais_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Registrar um resumo da instalação
      ansible.builtin.copy:
        dest: "{{ telium_etc }}/instalacao.txt"
        owner: root
        group: root
        mode: "0600"
        content: |
          Telium PABX — instalado em {{ ansible_date_time.iso8601 | default('') }}
          host: {{ inventory_hostname }} ({{ ansible_facts.default_ipv4.address | default('127.0.0.1') }})

          Console ...... https://{{ ansible_facts.default_ipv4.address | default('127.0.0.1') }}/
          Usuário ...... admin
          Senha ........ {{ senha_padrao_console }}

          A senha do admin é restaurada a cada provisionamento, de propósito:
          garante que sempre exista uma forma conhecida de entrar. Para uma
          conta com senha própria, crie outro administrador pelo console.

          As senhas de serviço (banco, AMI, ARI) foram geradas nesta
          instalação e estão em {{ credenciais_dir }}, uma por arquivo.
          Elas nunca são exibidas na tela nem versionadas.

          Trocar a senha do console:
            cd {{ telium_api }} && php bin/telium senha admin

    - name: Endereços de acesso
      ansible.builtin.debug:
        msg:
          - "Console ....... https://{{ ansible_facts.default_ipv4.address | default('127.0.0.1') }}/"
          - "API ........... https://{{ ansible_facts.default_ipv4.address | default('127.0.0.1') }}/api/health"
          - "Janus ......... https://{{ ansible_facts.default_ipv4.address | default('127.0.0.1') }}/janus/info"
          - ""
          - "Login ......... admin / {{ senha_padrao_console }}"
          - "  (esta senha é reimposta a cada execução do playbook —"
          - "   para uma conta com senha própria, crie outro administrador)"
          - "Senhas de serviço em {{ credenciais_dir }} (0600, só root)"
          - "Resumo salvo em {{ telium_etc }}/instalacao.txt"
          - ""
          - "Verificação ... sudo ansible-playbook verificar.yml"
