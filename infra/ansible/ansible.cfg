[defaults]
inventory            = inventory/local.ini
roles_path           = roles
host_key_checking    = False
# Saída em YAML pelo callback nativo. Antes usávamos community.general.yaml,
# que está depreciado e imprimia um aviso a cada execução.
stdout_callback      = default
result_format        = yaml
interpreter_python   = auto_silent
display_skipped_hosts = False
retry_files_enabled  = False
forks                = 10

[privilege_escalation]
become        = True
become_method = sudo
