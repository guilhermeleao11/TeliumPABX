<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="960" height="560" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#0b4f8a">2. Descobrir o IP do Yealink T20</text>
<rect x="150" y="70" width="600" height="420" rx="36" fill="#2b2f36"/>
<rect x="210" y="110" width="330" height="150" rx="6" fill="#c9d6c5" stroke="#111" stroke-width="3"/>
<text x="228" y="150" font-size="17" fill="#111" font-family="DejaVu Sans Mono, monospace">Status</text>
<text x="228" y="185" font-size="17" fill="#111" font-family="DejaVu Sans Mono, monospace">IPv4: 192.168.0.50</text>
<text x="228" y="215" font-size="17" fill="#111" font-family="DejaVu Sans Mono, monospace">MAC : 00:15:65:xx:xx:xx</text>
<circle cx="640" cy="185" r="44" fill="#3d434d"/>
<circle cx="640" cy="185" r="22" fill="#5b6370" stroke="#f59e0b" stroke-width="4"/>
<text x="640" y="191" font-size="15" text-anchor="middle" fill="#fff">OK</text>
<rect x="230" y="290" width="90" height="36" rx="8" fill="#3d434d"/><text x="275" y="314" font-size="16" text-anchor="middle" fill="#fff">1</text><rect x="340" y="290" width="90" height="36" rx="8" fill="#3d434d"/><text x="385" y="314" font-size="16" text-anchor="middle" fill="#fff">2</text><rect x="450" y="290" width="90" height="36" rx="8" fill="#3d434d"/><text x="495" y="314" font-size="16" text-anchor="middle" fill="#fff">3</text><rect x="230" y="338" width="90" height="36" rx="8" fill="#3d434d"/><text x="275" y="362" font-size="16" text-anchor="middle" fill="#fff">4</text><rect x="340" y="338" width="90" height="36" rx="8" fill="#3d434d"/><text x="385" y="362" font-size="16" text-anchor="middle" fill="#fff">5</text><rect x="450" y="338" width="90" height="36" rx="8" fill="#3d434d"/><text x="495" y="362" font-size="16" text-anchor="middle" fill="#fff">6</text><rect x="230" y="386" width="90" height="36" rx="8" fill="#3d434d"/><text x="275" y="410" font-size="16" text-anchor="middle" fill="#fff">7</text><rect x="340" y="386" width="90" height="36" rx="8" fill="#3d434d"/><text x="385" y="410" font-size="16" text-anchor="middle" fill="#fff">8</text><rect x="450" y="386" width="90" height="36" rx="8" fill="#3d434d"/><text x="495" y="410" font-size="16" text-anchor="middle" fill="#fff">9</text><rect x="230" y="434" width="90" height="36" rx="8" fill="#3d434d"/><text x="275" y="458" font-size="16" text-anchor="middle" fill="#fff">*</text><rect x="340" y="434" width="90" height="36" rx="8" fill="#3d434d"/><text x="385" y="458" font-size="16" text-anchor="middle" fill="#fff">0</text><rect x="450" y="434" width="90" height="36" rx="8" fill="#3d434d"/><text x="495" y="458" font-size="16" text-anchor="middle" fill="#fff">#</text>
<text x="770" y="175" font-size="14" fill="#f59e0b">aperte OK com o</text>
<text x="770" y="195" font-size="14" fill="#f59e0b">telefone parado</text>
<text x="24" y="512" font-size="14" fill="#1e293b">O IP aparece no visor. Num computador da mesma rede, abra no navegador http://192.168.0.50</text><text x="24" y="534" font-size="14" fill="#1e293b">Login de fábrica: usuário admin, senha admin (troque depois, em Security).</text>
<text x="936" y="566" font-size="11" fill="#64748b" text-anchor="end">Ilustração — o layout real varia com a versão do sistema e do firmware</text>
